<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Noto+Serif+KR:wght@500;700&display=swap" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="studio.js"></script>
<style>
  :root { --void: #04050A; --light: #F4F1EA; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--void); }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--void);
    font-family: 'Inter', 'Noto Serif KR', sans-serif; color: var(--light); }
  #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  .src { position: absolute; left: -9999px; top: 0; width: 10px; }
  #real { position: absolute; left: 70px; top: 314px; width: 940px; height: 1092px; opacity: 0; transform-origin: 50% 50%; }
  .txt { position: absolute; left: 76px; white-space: nowrap; opacity: 0; }
  #name { top: 1466px; font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 104px; line-height: 1.1;
    text-shadow: 0 0 26px rgba(244,241,234,0.5); }
  #han { left: 150px; top: 520px; font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 760px; line-height: 1;
    text-shadow: 0 0 40px rgba(244,241,234,0.7), 0 0 130px rgba(244,241,234,0.35); }
  #by { top: 1614px; left: 82px; font-size: 30px; font-weight: 500; letter-spacing: 0.34em; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1080" data-height="1920">
  <canvas id="stage" width="1080" height="1920"></canvas>
  <img class="src" id="art" src="media/yeon.jpg" /><img class="src" id="dep" src="media/yeon_depth.png" />
  <img id="real" src="media/yeon.jpg" />
  <div class="txt" id="han">緣</div>
  <div class="txt" id="name">연 (緣)</div>
  <div class="txt" id="by">메타루카 · 원화</div>
</div>
<script>
  const S = STUDIO, W = 1080, H = 1920;
  const cv = document.getElementById('stage'), ctx = cv.getContext('2d');
  const work = document.createElement('canvas'); work.width = W; work.height = H;
  const wctx = work.getContext('2d');
  const out = wctx.createImageData(W, H), px = out.data;
  const acc = new Float32Array(W * H * 4), zb = new Float32Array(W * H);

  // ---- the sculpture: every point is one dab of the real painting, pushed back by the depth map ----
  const N = 320000, PW = 940, PH = 1092, CX = 540, CY = 860, F = 2400, DEPTH = 520, PIVOT_Z = -110;
  const hx = new Float32Array(N), hy = new Float32Array(N), hz = new Float32Array(N);   // home (the painting)
  const dx = new Float32Array(N), dy = new Float32Array(N), dz = new Float32Array(N);   // dust (before it gathers)
  const cr = new Float32Array(N), cg = new Float32Array(N), cb = new Float32Array(N);
  const da = new Float32Array(N), dl = new Float32Array(N), slx = new Float32Array(N), sly = new Float32Array(N);
  const r1 = new Float32Array(N), r2 = new Float32Array(N), r3 = new Float32Array(N), r4 = new Float32Array(N);
  const SX = new Float32Array(N), SY = new Float32Array(N), ZC = new Float32Array(N), AL = new Float32Array(N);
  const BK = new Uint8Array(N), CR = new Float32Array(N), CG = new Float32Array(N), CB = new Float32Array(N);

  let ready = false;
  function build() {
    const art = document.getElementById('art'), dep = document.getElementById('dep');
    if (!(art.complete && dep.complete && art.naturalWidth && dep.naturalWidth)) return false;
    const rnd = S.rng(1115);
    const cols = Math.round(Math.sqrt(N * PW / PH)), rows = Math.ceil(N / cols);
    const grab = (img) => { const c = document.createElement('canvas'); c.width = cols; c.height = rows;
      const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(img, 0, 0, cols, rows); return g.getImageData(0, 0, cols, rows).data; };
    const A = grab(art);
    // the depth picture carries 16 bits in two channels, so it is read at its own size and never blended
    const dw = dep.naturalWidth, dh = dep.naturalHeight, dc = document.createElement('canvas'); dc.width = dw; dc.height = dh;
    const dg = dc.getContext('2d', { willReadFrequently: true }); dg.imageSmoothingEnabled = false; dg.drawImage(dep, 0, 0);
    const dd = dg.getImageData(0, 0, dw, dh).data, DZ = new Float32Array(dw * dh);
    for (let j = 0, q = 0; j < dw * dh; j++, q += 4) DZ[j] = (dd[q] * 256 + dd[q + 1]) / 65535;
    const depthAt = (u, v) => DZ[Math.min(dh - 1, Math.max(0, Math.round(v * (dh - 1)))) * dw + Math.min(dw - 1, Math.max(0, Math.round(u * (dw - 1))))];
    for (let i = 0; i < N; i++) {
      const gx = i % cols, gy = Math.min(rows - 1, (i / cols) | 0), o = (gy * cols + gx) * 4;
      const x = ((gx + 0.5 + (rnd() - 0.5) * 0.8) / cols - 0.5) * PW, y = ((gy + 0.5 + (rnd() - 0.5) * 0.8) / rows - 0.5) * PH;
      const uu = x / PW + 0.5, vv = y / PH + 0.5, near = depthAt(uu, vv), z = -(near - 0.5) * DEPTH;   // high = near = towards the lens
      // unproject along the lens ray, so from the front the points land exactly where the paint is
      const k = (F + z) / F; hx[i] = x * k; hy[i] = y * k; hz[i] = z;
      cr[i] = A[o] / 255; cg[i] = A[o + 1] / 255; cb[i] = A[o + 2] / 255;
      // how steeply the surface runs away here: steep parts open up when seen from the side, so they get wider dabs
      const su = 1.5 / cols, sv = 1.5 / rows;
      const gxm = Math.abs(depthAt(uu + su, vv) - depthAt(uu - su, vv)) * DEPTH / (2 * su * PW);
      const gym = Math.abs(depthAt(uu, vv + sv) - depthAt(uu, vv - sv)) * DEPTH / (2 * sv * PH);
      // gentle slopes get wider dabs when seen side-on; a cliff (a real edge) gets none, so it stays a clean cut
      slx[i] = gxm > 6 ? 0 : Math.min(2.5, gxm); sly[i] = gym > 6 ? 0 : Math.min(2.5, gym);
      r1[i] = rnd(); r2[i] = rnd(); r3[i] = rnd(); r4[i] = rnd();
      dx[i] = (rnd() - 0.5) * 4600; dy[i] = (rnd() - 0.5) * 6400; dz[i] = -1300 + rnd() * 5200;
      da[i] = rnd() < 0.03 ? 1 : 0.04 + rnd() * 0.1;
      // the gathering starts at her eyes and spreads outwards
      const dist = Math.hypot(x - (-40), y - (-250)) / 900;
      dl[i] = Math.min(1, Math.max(0, dist * 0.8 + rnd() * 0.2));
    }
    return true;
  }
  const NB = 1500, bx = new Float32Array(NB), by = new Float32Array(NB), bz = new Float32Array(NB), bp = new Float32Array(NB);
  { const r = S.rng(77); for (let i = 0; i < NB; i++) { bx[i] = (r() - 0.5) * 7000; by[i] = (r() - 0.5) * 9000; bz[i] = 1400 + r() * 4200; bp[i] = r(); } }

  // ---- the dance: camera poses that land on the piano's strong notes -------------------------------
  // [time, yaw, pitch, distance (1 = the painting fills the frame), look-at x, look-at y, roll]
  const KEYS = [
    [0.00, -0.90,  0.15, 1.90,    0,    0, -0.25],
    [3.81, -0.42,  0.05, 0.50,  -40, -250,  0.00],   // close on her eyes as the last points arrive
    [5.29,  0.20, -0.05, 0.40,  -40, -230,  0.10],   // slide across her face, almost touching
    [5.80,  0.85, -0.15, 0.95,    0, -100,  0.22],   // whip out wide to her side, tilted
    [6.83,  0.25,  0.55, 0.42,    0,  330, -0.18],   // drop under and skim the armour
    [7.80, -0.30,  0.35, 0.36, -150,  250,  0.12],   // slide along the breastplate
    [8.31, -0.85,  0.10, 0.80,    0,    0, -0.25],   // whip to the other side
    [9.82, -0.45, -0.05, 0.50,  230, -120, -0.12],   // glide up into the flying hair
    [11.31, -0.15, 0.00, 0.17,  280, -190,  0.00],   // plunge between the strands: she bursts into dust
    [11.82,  0.00, -0.10, 1.90,   0,    0,  0.30],   // thrown far back, the whole cloud in view
    [12.79,  0.75, -0.25, 1.05,   0,  -40, -0.20],   // she is whole again; orbit high on the right
    [13.31,  0.10,  0.10, 0.60,   0, -200,  0.00],   // snap in front, close
    [13.79, -0.75,  0.15, 0.85,   0,  -60,  0.25],
    [14.30, -0.20,  0.45, 0.48,   0,  150, -0.10],
    [14.79,  0.60,  0.30, 0.58,   0, -200,  0.20],
    [15.30,  0.25, -0.20, 1.35,   0,    0, -0.30],   // up and away
    [15.79,  0.00,  0.00, 1.00,   0,    0,  0.00],   // land square in front: this is the painting
    [20.00,  0.00,  0.00, 1.00,   0,    0,  0.00],
  ];
  const io3 = (p) => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
  const io4 = (p) => p < 0.5 ? 8 * p * p * p * p : 1 - Math.pow(-2 * p + 2, 4) / 2;
  // the piano's strong notes while she stands: the relief swells on each one
  const ONS = [5.29, 5.80, 6.83, 7.80, 8.31, 9.82, 12.79, 13.31, 13.79, 14.30, 14.79, 15.30];
  const BURST = 11.20, BURST_LEN = 1.45;               // she bursts into dust and comes back
  const cr4 = (a, b, c, d, u) => 0.5 * ((2 * b) + (-a + c) * u + (2 * a - 5 * b + 4 * c - d) * u * u + (-a + 3 * b - 3 * c + d) * u * u * u);
  function pose(t) {
    let i = 0; while (i < KEYS.length - 2 && t >= KEYS[i + 1][0]) i++;
    const k0 = KEYS[Math.max(0, i - 1)], k1 = KEYS[i], k2 = KEYS[i + 1], k3 = KEYS[Math.min(KEYS.length - 1, i + 2)];
    let u = Math.min(1, Math.max(0, (t - k1[0]) / (k2[0] - k1[0])));
    // whip between poses and arrive right on the note; short hops get a softer whip so they never read as a cut
    const span = k2[0] - k1[0];
    u = span < 0.7 ? 0.45 * u + 0.55 * io3(u) : span < 1.2 ? 0.3 * u + 0.7 * io3(u) : 0.18 * u + 0.82 * io4(u);
    const last = i >= KEYS.length - 3;                 // the landing must be exact: no overshoot
    const v = (j) => last ? k1[j] + (k2[j] - k1[j]) * io3(Math.min(1, Math.max(0, (t - k1[0]) / (k2[0] - k1[0])))) : cr4(k0[j], k1[j], k2[j], k3[j], u);
    // after the landing she is never frozen: the lens keeps easing in, very slowly
    const settle = 1 - 0.075 * S.seg(t, 15.79, 4.21, 'sine.out');
    return { yaw: v(1), pitch: v(2), dist: Math.min(2.2, Math.max(0.15, v(3))) * settle, tx: v(4), ty: v(5), roll: v(6) };
  }

  const GATHER = 1.30, FLY = 1.5, SPREAD = 1.0;       // the points start to gather on the first strong note

  const real = document.getElementById('real'), nameEl = document.getElementById('name'), byEl = document.getElementById('by');

  window.__timelines["main"] = S.play(function render(t) {
    if (!ready) { ready = build(); if (!ready) return; }
    const c0 = pose(t), cb4 = pose(Math.max(0, t - 1 / 30));
    // a real camera smears a fast move across the frame; so does this one. The faster the whip, the more
    // moments are stacked into one frame, so a whip reads as a sweep and never as a jump
    const speed = Math.abs(c0.yaw - cb4.yaw) + Math.abs(c0.pitch - cb4.pitch) + Math.abs(c0.roll - cb4.roll)
      + Math.abs(c0.dist - cb4.dist) / Math.min(c0.dist, cb4.dist) + (Math.abs(c0.tx - cb4.tx) + Math.abs(c0.ty - cb4.ty)) / 500;
    const NS = speed > 0.09 ? 6 : speed > 0.045 ? 4 : speed > 0.018 ? 2 : 1, SHUTTER = 0.9 / 30;
    const u = t - GATHER, moving = u < FLY + SPREAD, drift = t * 160;
    const spacing = Math.sqrt(PW * PH / N);
    let pulse = 0; for (const o of ONS) if (t >= o) pulse = Math.max(pulse, Math.min(1, (t - o) / 0.1) * Math.exp(-7 * (t - o)));   // swells over 3 frames, never pops
    pulse *= 1 - S.seg(t, 15.55, 0.24, 'power2.in');   // calm before the landing, so the painting is exact
    const zs = 1 + 0.32 * pulse, ub = t - BURST, bursting = ub > 0 && ub < BURST_LEN + 0.3;
    acc.fill(0);
    for (let sI = 0; sI < NS; sI++) {
    const c = NS === 1 ? c0 : pose(Math.max(0, t - SHUTTER * sI / NS));
    const cyw = Math.cos(c.yaw), syw = Math.sin(c.yaw), cp = Math.cos(c.pitch), sp = Math.sin(c.pitch);
    const cro = Math.cos(c.roll), sro = Math.sin(c.roll), camD = c.dist * F + PIVOT_Z;
    const asy = Math.abs(syw), asp = Math.abs(sp);
    zb.fill(1e9);

    // far stars: they slide behind her as the camera swings
    for (let i = 0; i < NB; i++) {
      const X = bx[i] - c.tx * 0.3, Y = by[i] - c.ty * 0.3, Z = bz[i];
      const x1 = X * cyw + Z * syw, z1 = -X * syw + Z * cyw, y1 = Y * cp - z1 * sp, z2 = Y * sp + z1 * cp + camD;
      if (z2 < 200) continue;
      const q = F / z2, ax = x1 * q, ay = y1 * q, sx = Math.round(CX + ax * cro - ay * sro), sy = Math.round(CY + ax * sro + ay * cro);
      if (sx < 1 || sy < 1 || sx >= W - 1 || sy >= H - 1) continue;
      const tw = (0.5 + 0.5 * Math.sin(2 * Math.PI * (t * (0.3 + bp[i] * 0.6) + bp[i] * 9))) * (bp[i] < 0.1 ? 1.4 : 0.45);
      const o = (sy * W + sx) * 4; acc[o] += 0.92 * tw; acc[o + 1] += 0.95 * tw; acc[o + 2] += tw; acc[o + 3] += tw;
    }

    // pass 1: where every point lands on screen, and which one is in front
    for (let i = 0; i < N; i++) {
      let e = 1; if (moving) { const p = (u - dl[i] * SPREAD) / FLY; e = p <= 0 ? 0 : p >= 1 ? 1 : io3(p); }
      let X, Y, Z, al = 1, fly = 0, R = cr[i], G = cg[i], B = cb[i];
      if (e >= 1) {
        X = hx[i]; Y = hy[i]; Z = hz[i] * zs;
        if (bursting) {                                  // thrown outwards from her heart, spinning, then drawn back
          const p2 = (ub - 0.3 * r1[i]) / BURST_LEN, e2 = p2 <= 0 ? 0 : p2 >= 1 ? 0 : Math.sin(Math.PI * p2);
          if (e2 > 0) {
            const ox = hx[i] - 20, oy = hy[i] - 60, len = Math.hypot(ox, oy) + 80, pw = e2 * (260 + 900 * r3[i]);
            const a2 = 1.6 * e2 * (r2[i] - 0.3), c2 = Math.cos(a2), s2 = Math.sin(a2);
            const bx2 = X + ox / len * pw, by2 = Y + oy / len * pw;
            X = bx2 * c2 - by2 * s2; Y = bx2 * s2 + by2 * c2; Z = Z + (r4[i] - 0.5) * 1500 * e2;
            fly = e2;
            const L = 0.299 * R + 0.587 * G + 0.114 * B, st = 1 + 0.8 * e2, gn = 1 + 0.7 * e2;
            R = Math.max(0, L + (R - L) * st) * gn; G = Math.max(0, L + (G - L) * st) * gn; B = Math.max(0, L + (B - L) * st) * gn;
          }
        }
      }
      else {
        fly = Math.sin(Math.PI * e);
        const sxp = dx[i], syp = dy[i], szp = dz[i] - drift;
        const mx = sxp + (hx[i] - sxp) * e, my = syp + (hy[i] - syp) * e, mz = szp + (hz[i] - szp) * e;
        const ang = 1.25 * fly * (0.5 + r1[i]), ca = Math.cos(ang), sa = Math.sin(ang), bd = 6.2832 * r2[i], br = 260 * fly * r3[i];
        X = mx * ca - my * sa + Math.cos(bd) * br; Y = mx * sa + my * ca + Math.sin(bd) * br; Z = mz - fly * 500 * r4[i];
        al = da[i] + (1 - da[i]) * Math.sqrt(e);
        if (e > 0) { const L = 0.299 * R + 0.587 * G + 0.114 * B, st = 1 + 0.9 * fly, gn = 1 + 0.6 * fly;
          R = Math.max(0, L + (R - L) * st) * gn; G = Math.max(0, L + (G - L) * st) * gn; B = Math.max(0, L + (B - L) * st) * gn; }
        else { R = 0.75 + 0.25 * R; G = 0.78 + 0.22 * G; B = 0.85 + 0.15 * B; }
      }
      X -= c.tx; Y -= c.ty; Z -= PIVOT_Z;
      const x1 = X * cyw + Z * syw, z1 = -X * syw + Z * cyw, y1 = Y * cp - z1 * sp, z2 = Y * sp + z1 * cp + camD;
      if (z2 < 70) { BK[i] = 0; continue; }
      const q = F / z2, ax = x1 * q, ay = y1 * q;
      const sx = CX + ax * cro - ay * sro, sy = CY + ay * cro + ax * sro;
      let b = e <= 0 ? (al > 0.9 ? 3 : 1) : fly > 0.1 ? (r3[i] > 0.9 ? 3 : 2) : Math.ceil(spacing * q * 1.4 * (1 + slx[i] * asy + sly[i] * asp));
      if (b > 9) b = 9;
      if (sx < -b || sy < -b || sx >= W + b || sy >= H + b) { BK[i] = 0; continue; }
      SX[i] = sx; SY[i] = sy; ZC[i] = z2; AL[i] = al * (fly > 0.1 ? 0.8 + 0.5 * fly : 1); BK[i] = b; CR[i] = R; CG[i] = G; CB[i] = B;
      if (al < 0.6) continue;                           // thin dust does not hide anything
      const x0 = Math.round(sx - b / 2), y0 = Math.round(sy - b / 2);
      for (let yy = y0; yy < y0 + b; yy++) { if (yy < 0 || yy >= H) continue; let o = yy * W + x0;
        for (let xx = x0; xx < x0 + b; xx++, o++) { if (xx < 0 || xx >= W) continue; if (z2 < zb[o]) zb[o] = z2; } }
    }
    // pass 2: paint only what is not hidden behind something nearer
    for (let i = 0; i < N; i++) {
      const b = BK[i]; if (!b) continue;
      const z2 = ZC[i], lim = z2 - 14 - z2 * 0.006, w = AL[i], R = CR[i] * w, G = CG[i] * w, B = CB[i] * w;
      const x0 = Math.round(SX[i] - b / 2), y0 = Math.round(SY[i] - b / 2);
      for (let yy = y0; yy < y0 + b; yy++) { if (yy < 0 || yy >= H) continue; let o = yy * W + x0;
        for (let xx = x0; xx < x0 + b; xx++, o++) { if (xx < 0 || xx >= W) continue; if (zb[o] < lim) continue;
          const p = o * 4; acc[p] += R; acc[p + 1] += G; acc[p + 2] += B; acc[p + 3] += w; } }
    }
    }
    if (NS > 1) { const inv = 1 / NS; for (let o = 0, n = acc.length; o < n; o++) acc[o] *= inv; }
    for (let o = 0, n = W * H * 4; o < n; o += 4) {
      const w = acc[o + 3];
      if (w <= 0) { px[o] = 4; px[o + 1] = 5; px[o + 2] = 10; px[o + 3] = 255; continue; }
      const kk = w > 0.6 ? 255 / w : 255 / 0.6;
      const r = acc[o] * kk + 4, g = acc[o + 1] * kk + 5, b = acc[o + 2] * kk + 10;
      px[o] = r > 255 ? 255 : r; px[o + 1] = g > 255 ? 255 : g; px[o + 2] = b > 255 ? 255 : b; px[o + 3] = 255;
    }
    wctx.putImageData(out, 0, 0);
    const air = moving ? Math.sin(Math.PI * Math.min(1, Math.max(0, u / (FLY + SPREAD)))) : 0;
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; ctx.filter = 'none'; ctx.drawImage(work, 0, 0);
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.14 + 0.6 * air + (t < GATHER + 0.4 ? 0.45 : 0) + 0.3 * pulse + (bursting ? 0.5 * Math.sin(Math.PI * Math.min(1, ub / (BURST_LEN + 0.3))) : 0);
    ctx.filter = 'blur(14px)'; ctx.drawImage(work, 0, 0);
    ctx.filter = 'none'; ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

    // the landing: the points give way to the real painting, then it breathes in very slowly
    real.style.opacity = S.seg(t, 16.3, 1.0, 'sine.inOut').toFixed(4);
    real.style.transform = `scale(${(1 / c0.dist).toFixed(5)})`;                    // the same slow push as the points under it
    const hEl = document.getElementById('han'), ho = Math.min(S.seg(t, 0.1, 0.6, 'power2.out'), 1 - S.seg(t, 1.3, 0.9, 'power2.in'));
    hEl.style.opacity = (ho * 0.92).toFixed(4);
    hEl.style.transform = `translate(${(60 - 150 * S.seg(t, 0, 2.3, 'sine.inOut')).toFixed(2)}px, 0px) scale(${(1 + 0.12 * S.seg(t, 0, 2.3, 'sine.in')).toFixed(4)})`;
    hEl.style.filter = `blur(${((1 - ho) * 14).toFixed(2)}px)`;
    const on = S.seg(t, 17.3, 0.8, 'power2.out');
    nameEl.style.opacity = on.toFixed(4); nameEl.style.transform = `translateY(${((1 - S.seg(t, 17.3, 0.9, 'power3.out')) * 26).toFixed(2)}px)`;
    const ob = S.seg(t, 17.8, 0.8, 'power2.out');
    byEl.style.opacity = (ob * 0.8).toFixed(4); byEl.style.transform = `translateY(${((1 - S.seg(t, 17.8, 0.9, 'power3.out')) * 18).toFixed(2)}px)`;
  }, { loop: false });
</script>
</body>
</html>
