<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@600;900&family=Noto+Sans+KR:wght@600;900&display=swap" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="studio.js"></script>
<style>
  /* style: swiss-grid. Every colour comes from these tokens. */
  :root { --ground: #FFFFFF; --ink: #111111; --grid: #E6E6E6; --accent: #E4002B; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--ground);
    font-family: 'Inter', 'Noto Sans KR', sans-serif; color: var(--ink); }
  .vline { position: absolute; top: 0; width: 1px; height: 1920px; background: var(--grid); }
  .hline { position: absolute; left: 0; height: 1px; width: 1080px; background: var(--grid); }
  .mask { position: absolute; overflow: hidden; white-space: nowrap; }
  .word { position: absolute; left: 0; top: 0; display: inline-block; }
  .probe { display: inline-block; width: 0; height: 0; vertical-align: baseline; }
  .title { font-size: 150px; font-weight: 900; letter-spacing: -0.04em; line-height: 168px; }
  .label { font-size: 30px; font-weight: 600; letter-spacing: -0.01em; line-height: 44px; }
  .sub { font-size: 44px; font-weight: 600; letter-spacing: -0.01em; line-height: 72px; }
  #cell { position: absolute; left: 96px; top: 200px; width: 888px; height: 1230px; overflow: hidden; background: var(--grid); }
  .slot { position: absolute; left: 0; top: 0; width: 888px; height: 1230px; overflow: hidden; }
  .slot.ink { background: var(--ink); color: var(--ground); }
  .slot img { position: absolute; left: 0; top: 0; display: block; max-width: none; }
  .knock { position: absolute; left: 36px; bottom: -8px; font-size: 440px; font-weight: 900; letter-spacing: -0.05em; line-height: 0.86; }
  .knocklabel { position: absolute; left: 44px; top: 36px; font-size: 44px; font-weight: 600; letter-spacing: -0.01em; }
  #dot { position: absolute; left: 0; top: 0; width: 32px; height: 32px; border-radius: 50%; background: var(--accent); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920"></div>
<script>
  const S = STUDIO, root = S.root;
  const add = (parent, cls, css, html) => { const d = document.createElement('div'); d.className = cls;
    Object.assign(d.style, css || {}); if (html != null) d.innerHTML = html; parent.appendChild(d); return d; };

  // ---- the grid: 12 columns, 96 px margins, 24 px gutters -------------------------------
  const M = 96, GUT = 24, COL = (1080 - 2 * M - 11 * GUT) / 12;
  for (let c = 0; c <= 12; c++) {
    const x = M + c * (COL + GUT) - (c === 12 ? GUT : 0);
    add(root, 'vline', { left: x + 'px' });
    if (c > 0 && c < 12) add(root, 'vline', { left: (x - GUT) + 'px' });
  }
  [M, 1920 - M].forEach(y => add(root, 'hline', { top: y + 'px' }));

  // ---- the story: 7 states. 0 = opening, 1 to 5 = paintings, 6 = closing ---------------
  const SW = [1.5, 3.9, 6.3, 8.7, 11.1, 13.5];            // a state begins at each of these times
  const ROW1 = ['다락방', '집가는길', '달항아리', '염소자리', '연 (緣)', '선물', '메타루카'];
  const ROW2 = ['그림창고', '', '', '여인의 사색', '', '', ''];
  const SUB  = ['', '', '', '', '', '', '다락방 그림창고'];
  const IDX  = ['2026', '01 / 05', '02 / 05', '03 / 05', '04 / 05', '05 / 05', '2026'];
  const DOTROW = [1, 0, 0, 1, 0, 0, 0];                   // which title row carries the full stop

  // ---- the picture cell: one slot per state, they pass through like tiles ---------------
  const CW = 888, CH = 1230, STEP = CW + GUT;
  const cell = add(root, '', {}); cell.id = 'cell';
  // each painting: file, natural ratio (w / h), and where the eye should rest (0 to 1)
  const ART = [null,
    { src: 'media/art1.jpg', r: 1074 / 1400, fx: 0.5, fy: 0.55 },
    { src: 'media/art2.jpg', r: 1050 / 1400, fx: 0.5, fy: 0.5 },
    { src: 'media/art3.jpg', r: 1866 / 1400, whole: true },
    { src: 'media/art4.jpg', r: 1204 / 1400, fx: 0.45, fy: 0.3 },
    { src: 'media/art5.jpg', r: 954 / 1400, fx: 0.5, fy: 0.36 },
    null];
  const slots = ART.map((a, i) => {
    const s = add(cell, 'slot' + (a ? '' : ' ink'), {});
    if (!a) {
      s.innerHTML = '<div class="knocklabel">작품</div><div class="knock">05</div>';
      return { e: s };
    }
    const img = document.createElement('img'); img.src = a.src; s.appendChild(img);
    // cover the cell: fill the short side, crop the long side around the resting point
    let w, h;
    if (a.whole) { w = CW; h = CW / a.r; s.style.background = 'var(--grid)'; }   // the whole painting, on a mat
    else if (a.r > CW / CH) { h = CH; w = CH * a.r; } else { w = CW; h = CW / a.r; }
    img.style.width = w + 'px'; img.style.height = h + 'px';
    return { e: s, img, a, w, h };
  });

  // ---- text: masked rows. Each row holds one word per state and swaps them like a conveyor
  function makeRow(cls, left, top, width, height, texts) {
    const m = add(root, 'mask ' + cls, { left: left + 'px', top: top + 'px', width: width + 'px', height: height + 'px' });
    const spans = texts.map(tx => { const s = document.createElement('span'); s.className = 'word';
      s.innerHTML = tx + '<span class="probe"></span>'; m.appendChild(s); return s; });
    return { m, spans, top, height };
  }
  const R1Y = 1486, RH = 168;
  const row1 = makeRow('title', M, R1Y, 1080 - M, RH, ROW1);
  const row2 = makeRow('title', M, R1Y + RH, 1080 - M, RH, ROW2);
  const sub  = makeRow('sub', M, R1Y + RH + 12, 888, 72, SUB);
  const idx  = makeRow('label', M, 126, 300, 44, IDX);
  // the address stays put, top right, the whole time
  add(root, 'label', { position: 'absolute', right: M + 'px', top: '126px', textAlign: 'right' }, 'foresto.co.kr/@metaluca');
  const dot = add(root, '', {}); dot.id = 'dot';

  const FS = 150, D0 = 32;

  // one conveyor step: the old word rises out of the mask, the new one follows right behind it
  function conveyor(row, k, t, delay) {
    const H = row.height;
    row.spans.forEach((sp, i) => {
      let y = H * 1.5;                                               // parked below the mask
      if (k === 0) {
        if (i === 0) y = (1 - S.seg(t, 0.1 + delay, 0.6, 'expo.out')) * H;
      } else {
        const p = S.seg(t, SW[k - 1] + 0.1 + delay, 0.8, 'expo.inOut');
        if (i === k) y = (1 - p) * H;
        if (i === k - 1) y = -p * H;
      }
      sp.style.transform = `translateY(${y}px)`;
    });
  }

  window.__timelines["main"] = S.play(function render(t) {
    let k = 0; SW.forEach((s, i) => { if (t >= s) k = i + 1; });
    const ts = k ? SW[k - 1] : 0;

    // the cell: the new slot slides in from the right, the old one leaves to the left
    const pc = k ? S.seg(t, ts, 1.0, 'power3.inOut') : 1;
    slots.forEach((s, i) => {
      let x = 4000;
      if (i === k) x = (1 - pc) * STEP;
      if (i === k - 1) x = -pc * STEP;
      s.e.style.transform = `translateX(${x}px)`;
      if (!s.img) return;
      // the painting keeps moving a little the whole time it is on screen
      const t0 = SW[i - 1], t1 = SW[i] + 1.0, q = S.seg(t, t0, t1 - t0, 'sine.inOut');
      if (s.a.whole) {
        // nothing is cropped: the painting sits centred and eases up to full width
        s.img.style.transformOrigin = '50% 50%';
        s.img.style.transform = `translate(0px, ${(CH - s.h) / 2}px) scale(${S.mix(0.92, 1.0, q)})`;
      } else {
        const ox = -(s.w - CW) * s.a.fx, oy = -(s.h - CH) * s.a.fy, sc = S.mix(1.12, 1.0, q);
        s.img.style.transformOrigin = `${s.a.fx * 100}% ${s.a.fy * 100}%`;
        s.img.style.transform = `translate(${ox}px, ${oy}px) scale(${sc})`;
      }
    });

    // the words
    conveyor(row1, k, t, 0);
    conveyor(row2, k, t, 0.06);
    conveyor(sub, k, t, 0.12);
    conveyor(idx, k, t, 0);

    // the dot: the full stop. It hops to the end of the new title, squashes on landing, settles
    const b = row1.spans[0].querySelector('.probe').offsetTop;       // baseline inside a row box
    const at = (i) => { const r = DOTROW[i] ? row2 : row1;
      return [M + r.spans[i].offsetWidth + 0.03 * FS, r.top + b]; };
    const hopStart = k ? ts + 0.1 : 0.45;
    const [x1, y1] = at(k);
    const [x0, y0] = k ? at(k - 1) : [-80, y1];
    let x = x1, y = y1, sx = 1, sy = 1;
    const dt = t - hopStart;
    if (dt < 0) { x = x0; y = y0; }
    else if (dt < 0.12) {                                            // anticipation
      const a = S.seg(t, hopStart, 0.12, 'power2.out'); x = x0; y = y0; sx = 1 + 0.18 * a; sy = 1 - 0.22 * a;
    } else if (dt < 0.66) {                                          // the hop
      const p = (dt - 0.12) / 0.54, e = S.ease('power2.inOut')(p);
      x = S.mix(x0, x1, e); y = S.mix(y0, y1, e) - 220 * 4 * p * (1 - p);
      const v = Math.abs(1 - 2 * p); sx = 0.86 + 0.14 * v; sy = 1.18 - 0.18 * v;
    } else if (dt < 1.4) {                                           // land, squash, settle
      const d = dt - 0.66, sq = 0.3 * Math.exp(-9 * d) * Math.cos(16 * d);
      sx = 1 + sq; sy = 1 - sq;
    }
    dot.style.transformOrigin = '50% 100%';
    dot.style.transform = `translate(${x}px, ${y - D0}px) scale(${sx}, ${sy})`;
  }, { loop: false });
</script>
</body>
</html>
