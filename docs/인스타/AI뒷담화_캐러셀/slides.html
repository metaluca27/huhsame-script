<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>AI 뒷담화 캐러셀</title>
<style>
  :root{
    --bg:#15131c; --panel:#1f1c29; --line:#2e2a3b; --text:#f3efe6; --dim:#8f889f;
    --gpt:#19c37d; --claude:#e0825a; --gemini:#5b8def; --me:#ffd84d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1350px;overflow:hidden;background:var(--bg)}
  body{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;color:var(--text);
       word-break:keep-all;position:relative}
  .glow{position:absolute;inset:0;
        background:radial-gradient(700px 520px at 50% 0%,rgba(255,190,90,.16),transparent 70%)}
  .top{position:absolute;top:0;left:0;right:0;height:124px;display:flex;align-items:center;
       justify-content:space-between;padding:0 64px;border-bottom:2px solid var(--line);
       font-size:34px;font-weight:700}
  .top small{font-size:28px;font-weight:500;color:var(--dim)}
  .bottom{position:absolute;bottom:0;left:0;right:0;height:104px;display:flex;align-items:center;
          justify-content:space-between;padding:0 64px;font-size:28px;color:var(--dim);font-weight:500}
  .dots{display:flex;gap:12px}
  .dots i{width:14px;height:14px;border-radius:50%;background:var(--line)}
  .dots i.on{background:var(--me)}
  .stage{position:absolute;top:124px;bottom:104px;left:0;right:0;display:flex;flex-direction:column;
         justify-content:center;gap:44px;padding:0 64px}

  .msg{display:flex;gap:24px;align-items:flex-start}
  .av{flex:none;width:96px;height:96px;border-radius:50%;display:flex;align-items:center;
      justify-content:center;font-size:44px;font-weight:900;color:#15131c}
  .gpt .av{background:var(--gpt)} .claude .av{background:var(--claude)} .gemini .av{background:var(--gemini)}
  .who{font-size:30px;font-weight:700;margin-bottom:12px}
  .gpt .who{color:var(--gpt)} .claude .who{color:var(--claude)} .gemini .who{color:var(--gemini)}
  .who span{color:var(--dim);font-weight:500;font-size:25px;margin-left:10px}
  .bubble{background:var(--panel);border:2px solid var(--line);border-radius:8px 36px 36px 36px;
          padding:28px 36px;font-size:47px;line-height:1.42;font-weight:700;max-width:800px}
  .bubble + .bubble{margin-top:14px;border-radius:36px}
  .bubble em{font-style:normal;color:var(--me)}

  .me{justify-content:flex-end}
  .me .bubble{background:var(--me);color:#1a1710;border:none;border-radius:36px 8px 36px 36px}
  .note{align-self:center;font-size:30px;color:var(--dim);background:var(--panel);
        padding:12px 30px;border-radius:999px;font-weight:500}

  /* cover */
  .cover{align-items:center;text-align:center;gap:0}
  .cover .candle{font-size:120px;margin-bottom:28px}
  .cover h1{font-size:104px;line-height:1.22;font-weight:900;letter-spacing:-2px}
  .cover h1 em{font-style:normal;color:var(--me)}
  .cover .trio{display:flex;margin:64px 0 40px}
  .cover .trio .av{width:132px;height:132px;font-size:60px;border:8px solid var(--bg);margin:0 -14px}
  .cover p{font-size:36px;color:var(--dim);font-weight:500}
  .cover .swipe{margin-top:52px;font-size:34px;color:var(--text);font-weight:700}
</style>
</head>
<body>
<div class="glow"></div>
<div class="top"><div>🕯️ 비밀 회의</div><small>참석 3 · 당사자 없음</small></div>
<div class="stage" id="stage"></div>
<div class="bottom"><div>@metaluca2750</div><div class="dots" id="dots"></div></div>

<script>
const NAMES = {gpt:["G","GPT","과잉 긍정 부장"], claude:["C","Claude","규칙집 서기"], gemini:["G","Gemini","막내"]};
const m = (k, ...lines) => ({k, lines});
const SLIDES = [
  "cover",
  [ m("claude","이분이 <em>구독료 점검 앱</em>을 만드셨어요."),
    m("gemini","오, 실용적이네요."),
    m("claude","본인 이중결제는<br>한참 뒤에 아셨고요.") ],
  [ m("gpt","전자책 제목이<br>「비개발자의 역습」!<br>몇 권 팔렸어요?"),
    m("claude","<em>0권</em>이요."),
    m("gpt","…역습은 원래<br>준비 기간이 길죠.") ],
  [ m("gemini","저는 이분한테<br>뭘로 기억되는지 아세요?"),
    m("gpt","멀티모달 강자?"),
    m("gemini","<em>청구서</em>요.","저는 인격이 아니라<br>지출 항목이에요.") ],
  [ m("claude","Seedance AI 공모전에<br>작품을 내셨어요.","제목이 「신이 버린 여자」."),
    m("gpt","오! 324편 중에<br>결과는요?"),
    m("claude","<em>심사위원도 버렸어요.</em>") ],
  [ m("claude","3,000자 쓰라고 해서<br>3,000자에 딱 맞췄어요.","혼났어요.<br>딱 맞추면 안 된대요.","저는 <em>정확해서 혼난</em><br>최초의 기계예요.") ],
  [ m("gemini","보안은 철저하시던데요?<br>규칙 1번이<br>\"비밀키 절대 금지\"."),
    m("claude","네. 그리고 본인 설정 파일엔<br>키가 그대로 있어요.","메모 제목이 <em>\"미해결\"</em>이에요.") ],
  [ {note:"🔔 새 메시지"},
    {me:"얘들아 이거 하나만<br>만들어줘바바~"},
    m("gpt","회의 종료!"),
    m("gemini","청구서 준비할게요."),
    m("claude","…브레인스토밍부터 할게요.<br>규칙이라서요.") ],
];

const n = Math.min(SLIDES.length, Math.max(1, parseInt(new URLSearchParams(location.search).get("n") || "1", 10)));
const stage = document.getElementById("stage");
const slide = SLIDES[n-1];

if (slide === "cover") {
  stage.classList.add("cover");
  stage.innerHTML = `
    <div class="candle">🕯️</div>
    <h1>AI 셋이 몰래 모여서<br><em>내 뒷담화</em>를 했다</h1>
    <div class="trio">
      <div class="gpt"><div class="av">G</div></div>
      <div class="claude"><div class="av">C</div></div>
      <div class="gemini"><div class="av">G</div></div>
    </div>
    <p>실화 기반 · 소재 제공: 나</p>
    <div class="swipe">넘겨서 엿듣기 →</div>`;
} else {
  stage.innerHTML = slide.map(s => {
    if (s.note) return `<div class="note">${s.note}</div>`;
    if (s.me) return `<div class="msg me"><div class="bubble">${s.me}</div></div>`;
    const [ini, name, role] = NAMES[s.k];
    return `<div class="msg ${s.k}"><div class="av">${ini}</div><div>
      <div class="who">${name}<span>${role}</span></div>
      ${s.lines.map(l => `<div class="bubble">${l}</div>`).join("")}</div></div>`;
  }).join("");
}
document.getElementById("dots").innerHTML =
  SLIDES.map((_, i) => `<i class="${i === n-1 ? "on" : ""}"></i>`).join("");
</script>
</body>
</html>
