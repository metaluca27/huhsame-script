<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>무당벌레 형광펜</title>
<meta name="description" content="화면에 무당벌레를 풀어놓으면 문장을 따라 기어 다니며 형광펜을 칠하고 낙서해요. 톡 치면 날개 펴고 날아가요.">
<meta property="og:type" content="website">
<meta property="og:title" content="🐞 무당벌레 형광펜 — 디지털 다락방">
<meta property="og:description" content="화면에 풀어놓으면 문장을 따라 기어 다니며 형광펜을 칠해요. 톡 치면 날아가요!">
<meta property="og:image" content="https://vaulted-bus-346411.web.app/ladybug/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://vaulted-bus-346411.web.app/ladybug">
<meta name="twitter:card" content="summary_large_image">
<style>
  body { margin:0; background:#fff7f5; color:#2a1a1a; font:16px/1.7 -apple-system, "Malgun Gothic", sans-serif; }
  main { max-width:640px; margin:0 auto; padding:32px 16px 96px; }
  h1 { font-size:26px; margin:0 0 6px; }
  h2 { font-size:19px; margin:32px 0 6px; }
  p { margin:8px 0; }
  .btn { display:inline-block; border:0; cursor:pointer; font:inherit; font-weight:700;
         padding:12px 20px; border-radius:999px; background:#d0001f; color:#fff; margin:6px 6px 6px 0; }
  .note { color:#8a6a66; font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>🐞 무당벌레 형광펜</h1>
  <p>보고 있는 웹페이지에 무당벌레를 풀어놓으면, 문장을 따라 기어 다니며 형광펜을 칠하고 낙서를 남겨요. 무당벌레를 톡 치면 날개를 펴고 날아가요.</p>
  <button class="btn" id="try">여기서 풀어보기</button>

  <h2>PC에서는 아무 사이트에나</h2>
  <p>PC 크롬용 <b>확장 프로그램 버전</b>도 있어요. 보고 있는 아무 웹페이지에나 무당벌레를 풀어놓을 수 있어서, 블로그든 쇼핑몰이든 문장마다 형광펜을 칠하고 다녀요.</p>
  <p class="note">폰 크롬은 확장 프로그램을 지원하지 않아서, 폰에서는 이 페이지에서만 놀 수 있어요. 아직 크롬 웹스토어에는 올리지 않았어요.</p>
</main>
<script>
  const SRC = location.origin + "/ladybug/content.js";

  document.getElementById("try").onclick = () => {
    if (window.__ladybug) return window.__ladybug.toggle();
    const s = document.createElement("script");
    s.src = SRC + "?" + Date.now();
    document.documentElement.appendChild(s);
  };

</script>
</body>
</html>
