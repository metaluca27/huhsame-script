<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>무당벌레 북마크 복사</title>
<style>
  body { margin:0; background:#fff7f5; color:#2a1a1a; font:17px/1.7 -apple-system, "Malgun Gothic", sans-serif; }
  main { max-width:640px; margin:0 auto; padding:32px 16px 64px; }
  h1 { font-size:24px; margin:0 0 12px; }
  .btn { border:0; cursor:pointer; font:inherit; font-weight:700; padding:14px 24px; border-radius:999px; background:#d0001f; color:#fff; }
  .btn:disabled { opacity:.5; }
  #ok { color:#1a7f37; font-weight:700; margin-left:8px; display:none; }
  ol { padding-left:22px; } li { margin:6px 0; }
  .note { color:#8a6a66; font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>🐞 무당벌레 북마크 복사</h1>
  <button class="btn" id="copy" disabled>불러오는 중…</button><span id="ok">복사됐어요!</span>
  <ol>
    <li>위 버튼으로 복사</li>
    <li>북마크 하나를 <b>수정</b> → 이름 <b>무당벌레</b>, 주소 칸 싹 지우고 <b>붙여넣기</b> → 저장</li>
    <li>브런치·네이버 블로그 글을 열고, <b>북마크 목록</b>에서 무당벌레 누르기</li>
  </ol>
  <p class="note">주소창에 붙여넣으면 검색이 돼요. 꼭 북마크 주소 칸에 넣으세요. 구글·위키백과처럼 보안이 빡센 곳에선 안 나와요.</p>
</main>
<script>
  const btn = document.getElementById("copy");
  let BM = "";
  fetch("/ladybug/bookmarklet.txt?v=" + Date.now(), { cache: "no-store" })
    .then((r) => r.text())
    .then((t) => { BM = t.trim(); btn.disabled = false; btn.textContent = "복사하기 (" + BM.length.toLocaleString() + "자)"; });
  btn.onclick = async () => {
    if (!BM) return;
    try { await navigator.clipboard.writeText(BM); }
    catch (e) {
      const ta = document.createElement("textarea");
      ta.value = BM; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); ta.remove();
    }
    document.getElementById("ok").style.display = "inline";
  };
</script>
</body>
</html>
