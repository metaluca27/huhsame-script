<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>다락방 작업노트 · 비개발자가 AI로 만든 것들</title>
<meta name="description" content="다락방 물건을 하나씩 눌러 보세요. 비개발자 메타루카가 AI랑 만든 앱 여섯 개의 제작기와 삽질담.">

<meta property="og:description" content="다락방 물건을 하나씩 눌러 보세요. 앱 여섯 개의 제작기와 삽질담.">

<style>
  :root {
    --ink: #fbefdc;
    --dim: #c9b49a;
    --warm: #ffb36b;
    --panel: rgba(36, 22, 16, 0.86);
    --line: rgba(251, 239, 220, 0.16);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1210; color: var(--ink);
    word-break: keep-all; font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* 입장 화면 */
  #intro { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px; background: radial-gradient(ellipse at 50% 35%, rgba(255,150,80,.22), rgba(26,18,16,.82) 65%);
    transition: opacity 1s ease; }
  #intro.gone { opacity: 0; pointer-events: none; }
  #intro .eyebrow { letter-spacing: .28em; font-size: 12px; color: var(--warm); margin-bottom: 14px; }
  #intro h1 { margin: 0 0 14px; font-size: clamp(30px, 8vw, 52px); font-weight: 700; text-shadow: 0 0 30px rgba(255,150,70,.35); }
  #intro p { margin: 0 0 30px; color: var(--dim); line-height: 1.7; font-size: 15px; }
  #enter { border: 1px solid rgba(255,179,107,.6); background: rgba(255,140,60,.16); border-radius: 999px;
    padding: 14px 34px; font-size: 16px; transition: background .3s; }
  #enter:hover { background: rgba(255,140,60,.32); }
  #intro .by { margin-top: 36px; font-size: 12px; color: var(--dim); opacity: .8; }

  .hud { opacity: 0; transition: opacity .8s ease .5s; pointer-events: none; }
  body.inside .hud { opacity: 1; pointer-events: auto; }
  #top { position: fixed; top: 0; left: 0; right: 0; z-index: 5; display: flex; justify-content: space-between; align-items: center;
    padding: calc(14px + env(safe-area-inset-top)) 16px 12px; }
  #top a { color: var(--dim); font-size: 14px; text-decoration: none; }
  .round { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel);
    backdrop-filter: blur(6px); font-size: 18px; display: grid; place-items: center; }
  .round[aria-pressed="true"] { border-color: var(--warm); }

  #progress { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 4;
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 10px 18px 12px; min-width: 200px; text-align: center;
    backdrop-filter: blur(6px); transition: opacity .4s; }
  body.reading #progress { opacity: 0; pointer-events: none; }
  #progress-text { font-size: 14px; }
  #progress .track { margin-top: 7px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; }
  #progress-bar { height: 100%; width: 0; background: var(--warm); transition: width .6s ease; }
  #hint { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 4;
    font-size: 13px; color: var(--dim); white-space: nowrap; transition: opacity .6s; }
  #hint.gone { opacity: 0 !important; }

  /* 말풍선 */
  #bubble { position: fixed; z-index: 6; transform: translate(-50%, -100%); width: max-content; max-width: min(280px, calc(100vw - 24px));
    background: #fffaf0; color: #3a2a1e; border-radius: 16px; padding: 10px 14px; font-size: 14px; line-height: 1.5;
    box-shadow: 0 6px 20px rgba(0,0,0,.35); opacity: 0; transition: opacity .3s; pointer-events: none; }
  #bubble.show { opacity: 1; }
  #bubble::after { content: ""; position: absolute; left: 50%; bottom: -8px; margin-left: -8px;
    border: 8px solid transparent; border-top-color: #fffaf0; border-bottom: 0; }

  /* 카드 패널 */
  #panel { position: fixed; left: 50%; bottom: 0; z-index: 8; width: min(540px, 100%);
    transform: translate(-50%, 105%); transition: transform .45s cubic-bezier(.2,.8,.2,1);
    background: var(--panel); border: 1px solid var(--line); border-bottom: 0; border-radius: 22px 22px 0 0;
    backdrop-filter: blur(10px); padding: 16px 0 calc(14px + env(safe-area-inset-bottom)); }
  #panel.open { transform: translate(-50%, 0); }
  #panel header { display: flex; align-items: flex-start; justify-content: space-between; padding: 0 18px 10px; }
  #panel-thing { font-size: 12px; letter-spacing: .12em; color: var(--warm); }
  #panel-name { margin: 2px 0 0; font-size: 20px; }
  #close { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: transparent; font-size: 16px; flex: none; }
  #track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  #track::-webkit-scrollbar { display: none; }
  .card { flex: 0 0 100%; scroll-snap-align: start; padding: 4px 18px 6px; min-height: 150px; max-height: 46vh; overflow-y: auto; }
  .card .step { font-size: 11px; color: var(--dim); letter-spacing: .1em; }
  .card h3 { margin: 4px 0 10px; font-size: 17px; color: var(--warm); }
  .card p { margin: 0; line-height: 1.75; font-size: 15px; }
  .card blockquote { margin: 0 0 12px; padding: 10px 14px; border-left: 3px solid var(--warm); background: rgba(255,179,107,.08);
    border-radius: 0 10px 10px 0; font-size: 15px; line-height: 1.6; }
  .try { display: inline-block; margin-top: 16px; padding: 12px 20px; border-radius: 999px; background: var(--warm); color: #2a160c;
    font-weight: 700; text-decoration: none; font-size: 15px; }
  #panel footer { display: flex; align-items: center; justify-content: space-between; padding: 10px 18px 0; }
  #dots { display: flex; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; border: 0; padding: 0; background: rgba(255,255,255,.22); }
  .dot.on { background: var(--warm); }
  #next { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 9px 18px; font-size: 14px; }

  /* 다 봤을 때 */
  #done { position: fixed; inset: 0; z-index: 12; display: grid; place-items: center; padding: 20px;
    background: rgba(20,12,8,.55); opacity: 0; pointer-events: none; transition: opacity .6s; }
  #done.open { opacity: 1; pointer-events: auto; }
  #done .box { width: min(400px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 20px;
    padding: 26px 22px 20px; text-align: center; backdrop-filter: blur(10px); }
  #done h2 { margin: 0 0 10px; font-size: 22px; }
  #done p { margin: 0 0 20px; color: var(--dim); line-height: 1.7; font-size: 15px; }
  #ebook { display: block; padding: 14px; border-radius: 14px; background: var(--warm); color: #2a160c; font-weight: 700; text-decoration: none; }
  #done .row { display: flex; gap: 8px; margin-top: 10px; }
  #done .row button { flex: 1; padding: 11px; border-radius: 12px; border: 1px solid var(--line); background: transparent; font-size: 14px; }

  @media (prefers-reduced-motion: reduce) { #panel, #intro, #done { transition: none; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

</script>
</head>
<body>
<canvas id="scene" aria-label="다락방 3D 화면. 빛나는 물건을 누르면 제작기가 열려요."></canvas>

<section id="intro">
  <div class="eyebrow">METALUCA'S ATTIC NOTES</div>
  <h1>다락방 작업노트</h1>
  <p>개발자가 아닌 제가 AI랑 만든 앱 여섯 개가<br>이 다락방 곳곳에 놓여 있어요.<br>빛나는 물건을 눌러 보세요.</p>
  <button id="enter">다락방 올라가기</button>
  <div class="by">메타루카 · 디지털 다락방 · 소리 있음</div>
</section>

<header id="top" class="hud">
  <a href="/">← 메타루카 홈</a>
  <button id="sound" class="round" aria-pressed="false" aria-label="소리 켜기/끄기">♪</button>
</header>

<div id="hint" class="hud">드래그해서 둘러보고, 빛나는 물건을 눌러 보세요</div>
<div id="progress" class="hud">
  <div id="progress-text">6개 중 0개 봤어요</div>
  <div class="track"><div id="progress-bar"></div></div>
</div>

<div id="bubble" role="status" aria-live="polite"></div>

<section id="panel" aria-label="물건 이야기">
  <header>
    <div><div id="panel-thing"></div><h2 id="panel-name"></h2></div>
    <button id="close" aria-label="닫기">✕</button>
  </header>
  <div id="track"></div>
  <footer><div id="dots"></div><button id="next">다음 →</button></footer>
</section>

<section id="done" aria-label="다 봤어요">
  <div class="box">
    <h2>다락방 한 바퀴 끝 🐾</h2>
    <p>여섯 개 다 보셨어요!<br>더 자세한 삽질 이야기는 전자책에 다 적어 뒀어요.</p>
    <a id="ebook" target="_blank" rel="noopener">전자책 「비개발자의 역습」 보러 가기</a>
    <div class="row">
      <button id="done-close">다락방 더 구경하기</button>
      <button id="reset">처음부터 다시</button>
    </div>
  </div>
</section>

<script type="module" src="/attic/main.js?v=2"></script>
</body>
</html>
