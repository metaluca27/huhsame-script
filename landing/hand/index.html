<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<base href="/hand/">  <!-- Firebase trailingSlash:false 라 /hand 에서 ./main.js 가 루트로 새지 않게 -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>손 홀로그램 · 디지털 다락방</title>
<script>
  // 카카오톡 안 브라우저는 녹화 파일 저장을 못 해서("지원하지 않는 파일 형식") 바깥 브라우저로 넘긴다
  if (/KAKAOTALK/i.test(navigator.userAgent)) {
    location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href);
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root { --holo: #6fd8ff; --ink: #e8f7ff; --bg: #02070c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: 'Gowun Dodum', system-ui, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  #frame { --ar: 1.7778; position: relative; width: min(100vw, calc(100vh * var(--ar))); aspect-ratio: var(--ar); }
  #frame video, #frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  video { transform: scaleX(-1); object-fit: cover; filter: brightness(.82) saturate(.9); }
  #guide { position: absolute; top: 0; bottom: 0; left: 50%; aspect-ratio: 9 / 16; transform: translateX(-50%);
    outline: 1px dashed rgba(111, 216, 255, .45); box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .35); pointer-events: none; }
  #guide.off { display: none; }
  #tag { position: absolute; left: 50%; top: 5%; transform: translateX(-50%); padding: .35em 1em;
    border: 1px solid var(--holo); border-radius: 999px; color: var(--holo); font-size: clamp(16px, 2.4vw, 30px);
    text-shadow: 0 0 12px var(--holo); background: rgba(2, 20, 30, .55); opacity: 0; transition: opacity .3s; }
  #tag.on { opacity: 1; }
  #help { position: absolute; left: 16px; bottom: 16px; font-size: 14px; line-height: 1.7; color: rgba(232, 247, 255, .75);
    background: rgba(0, 10, 16, .55); padding: 10px 14px; border-radius: 12px; }
  #bar { position: absolute; right: 16px; bottom: 16px; display: flex; gap: 8px; }
  button { font: inherit; color: var(--ink); background: rgba(0, 20, 30, .7); border: 1px solid rgba(111, 216, 255, .5);
    border-radius: 999px; padding: 8px 16px; cursor: pointer; }
  button:hover { border-color: var(--holo); }
  #rec.on { background: #c0262d; border-color: #ff6b6b; }
  #status { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-size: 20px;
    color: var(--holo); text-shadow: 0 0 10px var(--holo); pointer-events: none; }
  #status:empty { display: none; }
  /* id 를 dbg 로 하면 MediaPipe 엔진이 같은 이름 전역 함수로 착각해 멈춘다 (10-28) */
  #hud { position: absolute; right: 12px; top: 12px; font: 14px monospace; color: var(--holo);
    background: rgba(0, 10, 16, .6); padding: 4px 8px; border-radius: 6px; }
  #hud:empty { display: none; }
  /* 폰 세로 화면: 안내는 위로, 버튼은 아래로 나눠서 안 겹치게 */
  @media (max-aspect-ratio: 1/1) {
    #help { left: 10px; right: 10px; top: 10px; bottom: auto; font-size: 12px; text-align: center; padding: 6px 10px; }
    #tag { top: 70px; }
    #bar { left: 10px; right: 10px; bottom: 14px; justify-content: center; }
    #ratio { display: none; }
    #hud { top: auto; bottom: 64px; }
    button { padding: 7px 14px; font-size: 14px; }
  }
  .ui-hidden #help, .ui-hidden #bar button:not(#rec) { display: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="frame">
    <video id="cam" playsinline muted></video>
    <canvas id="holo"></canvas>
    <div id="guide"></div>
    <div id="tag"></div>
    <div id="status">카메라를 켜는 중…</div>
    <div id="hud"></div>
    <div id="help">☝️ 1 푸름이 · ✌️ 2 루릭 · 🤟 3 CLO · 👍 주주야<br>🖐️ 손바닥 쫙 = 등장 · ✊ 주먹 = 사라짐<br><small>손은 카메라에서 30cm쯤 떨어뜨려 손 전체가 화면에 보이게</small></div>
    <div id="bar">
      <button id="ratio" title="녹화 화면 비율">세로 9:16</button>
      <button id="hide" title="안내 글 숨기기 (H)">안내 숨김</button>
      <button id="rec">⏺ 녹화</button>
    </div>
  </div>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module" src="main.js"></script>
</body>
</html>
