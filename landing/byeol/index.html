<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>곁별</title>
<meta name="description" content="생일만 넣으면 오행 정령으로 바뀌고, 내 곁의 사람들과 궁합을 성좌 지도로 보여줘요.">
<link rel="stylesheet" href="/byeol/styles.css">
</head>
<body>
<main>
  <section class="screen active" id="screen-intro">
    <h1>곁별 ⭐</h1>
    <p class="subtitle">생일만 넣으면 내 오행 정령이 나오고,<br>내 곁의 사람들이 별로 떠요</p>
    <div class="form">
      <input type="text" id="me-name" class="fld" placeholder="내 이름 또는 별명" maxlength="12">
      <input type="number" id="me-year" class="fld" placeholder="태어난 해 (예: 1990)" min="1900" max="2099">
      <div class="row">
        <input type="number" id="me-month" class="fld" placeholder="월" min="1" max="12">
        <input type="number" id="me-day" class="fld" placeholder="일" min="1" max="31">
      </div>
      <div class="seg" id="me-cal">
        <button type="button" class="seg-btn active" data-cal="solar">양력</button>
        <button type="button" class="seg-btn" data-cal="lunar">음력</button>
      </div>
      <p class="hint">태어난 시간은 안 물어봐요. 생년월일만 있으면 돼요.</p>
      <button id="btn-me">내 정령 보기</button>
    </div>
  </section>

  <section class="screen" id="screen-me">
    <div id="me-card"></div>
    <button id="btn-to-add">곁의 사람 추가하러 가기</button>
  </section>

  <section class="screen" id="screen-add">
    <h2>곁의 사람 추가</h2>
    <p class="subtitle">아는 사람 생일을 넣으면 나와의 궁합이 지도에 떠요</p>
    <div class="form">
      <input type="text" id="add-name" class="fld" placeholder="이름 또는 별명" maxlength="12">
      <input type="number" id="add-year" class="fld" placeholder="태어난 해">
      <div class="row">
        <input type="number" id="add-month" class="fld" placeholder="월" min="1" max="12">
        <input type="number" id="add-day" class="fld" placeholder="일" min="1" max="31">
      </div>
      <div class="seg" id="add-cal">
        <button type="button" class="seg-btn active" data-cal="solar">양력</button>
        <button type="button" class="seg-btn" data-cal="lunar">음력</button>
      </div>
      <button id="btn-add">지도에 별로 올리기</button>
    </div>
    <div id="people-list"></div>
    <button id="btn-to-map">성좌 지도 보기</button>
  </section>
  <section class="screen" id="screen-map"></section>
</main>
<script src="/byeol/lib/lunar.js"></script>
<script src="/byeol/data.js"></script>
<script src="/byeol/saju.js"></script>
<script src="/byeol/compat.js"></script>
<script src="/byeol/people.js"></script>
<script src="/byeol/map.js"></script>
<script src="/byeol/app.js"></script>
</body>
</html>
