    background: var(--panel); border: 1px solid var(--line); color: var(--fg);

    flex: 1; min-height: 58px; padding: 8px 14px; border-radius: 16px;

  #sayInput:focus { outline: none; border-color: var(--accent); }
  #sayBtn {
    flex: 0 0 116px; min-height: 58px; border: none; border-radius: 16px; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #08121a; font-size: 19px; font-weight: 800; font-family: inherit;

  #waveBox.on { display: flex; }

  #waveBox i:nth-child(4) { animation-delay: 0.3s; } #waveBox i:nth-child(5) { animation-delay: 0.4s; }
  @keyframes wv { 50% { height: 30px; } }
  #waveBox span { color: var(--accent); font-size: 15px; margin-left: 8px; }
  /* 전체화면 오버레이 공통 */
  .overlay {
    position: fixed; inset: 0; background: var(--bg); z-index: 50;
    display: none; flex-direction: column; padding: 24px 20px; overflow-y: auto;

  .overlay.on { display: flex; }
  .overlay .closeBtn {
    min-height: 54px; border-radius: 14px; border: 1px solid var(--line);
    background: var(--panel); color: var(--fg); font-size: 18px; font-weight: 700;

  .voiceGrid button {

  }
  #toast {
    position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%);

    font-size: 16px; display: none; max-width: 92vw; text-align: center; z-index: 99;

  .setRow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .setRow .lbl { font-size: 17px; font-weight: 700; }
  .setRow button.tgl {
    min-height: 48px; padding: 0 18px; border-radius: 12px; cursor: pointer;
    background: var(--panel); border: 1px solid var(--line); color: var(--fg);

  .setRow button.tgl.on { border-color: var(--accent); color: var(--accent); }
  #phraseList { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  #phraseList div { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
  #phraseList span { flex: 1; font-size: 16px; }

<div id="captionArea"><span class="hint">아래 [듣기]를 켜면 상대방 말이 여기에 큰 글씨로 떠요</span></div>

  <div class="obTitle">내 목소리를 골라주세요</div>

    저는 소리가 잘 들리지 않아요.<br><br>이 화면에 대고 말씀해 주시면<br><b style="color:var(--accent)">글자로 보여요</b> 🙂
  </div>

<!-- 설정 -->

  <div class="obTitle">설정</div>
  <div class="setRow"><span class="lbl">내 목소리</span></div>
  <div class="voiceGrid" id="setGrid"></div>
  <div class="setRow">
    <span class="lbl">글자 크기</span>
    <button class="tgl" id="fontTgl">아주 크게</button>
  </div>
  <div class="setRow">
    <span class="lbl">진동 알림</span>
    <button class="tgl" id="vibeTgl">켜짐</button>
  </div>
  <div class="setRow"><span class="lbl">자주 쓰는 말 관리</span></div>
  <div id="phraseList"></div>
  <button class="closeBtn" id="setClose">닫기</button>
</div>

<div id="toast"></div>

<script>
const API = "https://small-recipe-9345.atlia0318.workers.dev";
const VOICES = [
  { id: "boy",     em: "👦", name: "개구쟁이 소년" },
  { id: "girl",    em: "👧", name: "똑부러진 소녀" },
  { id: "youngM",  em: "🧑", name: "차분한 청년" },
  { id: "youngF",  em: "👩", name: "밝은 아가씨" },
  { id: "middleM", em: "👨‍💼", name: "묵직한 아저씨" },
  { id: "middleF", em: "👩‍🦱", name: "다정한 아줌마" },
  { id: "oldM",    em: "👴", name: "인자한 할아버지" },
  { id: "oldF",    em: "👵", name: "구수한 할머니" },
];
const PREVIEW_TEXT = "안녕하세요, 반가워요. 제 목소리예요.";
const $ = (id) => document.getElementById(id);

// 홍보 스크린샷용 데모 모드 (?shot=onboard|talk|greet). 일반 사용엔 영향 없음
const SHOT = new URLSearchParams(location.search).get("shot");
if (SHOT === "onboard") localStorage.removeItem("look_voice");
else if (SHOT) localStorage.setItem("look_voice", localStorage.getItem("look_voice") || "youngF");

const state = {
  voice: localStorage.getItem("look_voice") || "",
  vibe: localStorage.getItem("look_vibe") !== "off",
  font: localStorage.getItem("look_font") || "xl",
};
if (state.font === "xxl") document.body.classList.add("font-xxl");

function vibe(pattern) {
  if (state.vibe && navigator.vibrate) { try { navigator.vibrate(pattern); } catch (_) {} }
}

function toast(msg) {
  $("toast").textContent = msg;
  $("toast").style.display = "block";
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { $("toast").style.display = "none"; }, 3000);
}

// ----- TTS -----
function pcmToWavBlob(b64, rate) {
  const bin = atob(b64);
  const pcm = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) pcm[i] = bin.charCodeAt(i);
  const buf = new ArrayBuffer(44 + pcm.length);
  const v = new DataView(buf);
  const w = (off, s) => { for (let i = 0; i < s.length; i++) v.setUint8(off + i, s.charCodeAt(i)); };
  w(0, "RIFF"); v.setUint32(4, 36 + pcm.length, true); w(8, "WAVE");
  w(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, "data"); v.setUint32(40, pcm.length, true);
  new Uint8Array(buf, 44).set(pcm);
  return new Blob([buf], { type: "audio/wav" });
}

// ----- IndexedDB 오디오 캐시 -----
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open("najombwa", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("tts", { keyPath: "key" });
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function cacheGet(key) {
  try {
    const d = await idb();
    return await new Promise((res) => {
      const q = d.transaction("tts").objectStore("tts").get(key);
      q.onsuccess = () => res(q.result || null);
      q.onerror = () => res(null);
    });
  } catch (_) { return null; }
}
async function cachePut(entry) {
  try {
    const d = await idb();
    d.transaction("tts", "readwrite").objectStore("tts").put(entry);
  } catch (_) {}
}
async function cacheTrim() {
  try {
    const d = await idb();
    const all = await new Promise((res) => {
      const q = d.transaction("tts").objectStore("tts").getAll();
      q.onsuccess = () => res(q.result || []);
      q.onerror = () => res([]);
    });
    if (all.length <= 100) return;
    const victims = all.filter((x) => !x.pinned).sort((a, b) => a.ts - b.ts).slice(0, all.length - 100);
    const tx = d.transaction("tts", "readwrite").objectStore("tts");
    victims.forEach((v) => tx.delete(v.key));
  } catch (_) {}
}

async function getTtsBlobUrl(text, voice, pinned) {
  const key = voice + ":" + text;
  const hit = await cacheGet(key);
  if (hit) {
    cachePut({ ...hit, ts: Date.now(), pinned: hit.pinned || !!pinned });
    return URL.createObjectURL(pcmToWavBlob(hit.pcm, hit.rate));
  }
  const res = await fetch(`${API}/voice/tts`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text, preset: voice, tone: "calm" }),
  });
  const d = await res.json();
  if (!res.ok || !d.audio) throw new Error(d.error || "tts fail");
  cachePut({ key, pcm: d.audio, rate: d.rate || 24000, ts: Date.now(), pinned: !!pinned });
  cacheTrim();
  return URL.createObjectURL(pcmToWavBlob(d.audio, d.rate || 24000));
}

let player = new Audio();
async function speak(text, pinned) {
  text = (text || "").trim().slice(0, 300);
  if (!text) return;
  $("sayBtn").disabled = true;
  try {
    const url = await getTtsBlobUrl(text, state.voice || "youngF", pinned);
    $("waveBox").classList.add("on");
    vibe(80);
    player.src = url;
    player.onended = () => { $("waveBox").classList.remove("on"); vibe([40, 60, 40]); };
    player.onerror = () => { $("waveBox").classList.remove("on"); };
    await player.play();
  } catch (_) {
    showBigText(text); // 소리를 못 내면 글자로라도 보여준다
  } finally {
    $("sayBtn").disabled = false;
  }
}

function showBigText(text) {
  const el = $("bigText");
  el.innerHTML = "";
  const div = document.createElement("div");
  div.textContent = text;
  const btn = document.createElement("button");
  btn.className = "closeBtn";
  btn.textContent = "닫기";
  btn.onclick = () => el.classList.remove("on");
  el.appendChild(div); el.appendChild(btn);
  el.classList.add("on");
}

// ----- 말하기 UI -----
$("sayBtn").addEventListener("click", () => {
  const t = $("sayInput").value.trim();
  if (!t) { toast("할 말을 입력해 주세요"); return; }
  speak(t);
});
$("sayInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("sayBtn").click(); }
});

// ----- 온보딩 (첫 실행: 목소리 선택) -----
let obPick = "youngF";
function renderVoiceGrid(container, selected, onPick) {
  container.innerHTML = "";
  VOICES.forEach((vc) => {
    const b = document.createElement("button");
    b.innerHTML = `<span class="em">${vc.em}</span>${vc.name}`;
    b.classList.toggle("sel", vc.id === selected);
    b.onclick = () => {
      onPick(vc.id);
      [...container.children].forEach((x, i) => x.classList.toggle("sel", VOICES[i].id === vc.id));
      // 미리듣기
      getTtsBlobUrl(PREVIEW_TEXT, vc.id).then((u) => { player.src = u; player.play().catch(() => {}); }).catch(() => {});
    };
    container.appendChild(b);
  });
}
if (!state.voice) {
  renderVoiceGrid($("obGrid"), obPick, (id) => { obPick = id; });
  $("onboard").classList.add("on");
}
$("obDone").addEventListener("click", () => {
  state.voice = obPick;
  localStorage.setItem("look_voice", obPick);
  $("onboard").classList.remove("on");
  toast("좋아요! 이제 아래에 할 말을 입력해 보세요");
});

// ----- 대화 시작 카드 -----
$("greetBtn").addEventListener("click", () => { $("greetCard").classList.add("on"); });
$("greetClose").addEventListener("click", () => { $("greetCard").classList.remove("on"); });

// ----- 인앱 브라우저 안내 -----
// 카카오톡 등 인앱 브라우저는 마이크 허용을 기억하지 못해 허용 창이 반복해서 뜬다.
// 크롬 등 기본 브라우저로 열면 한 번만 허용하면 되므로 밖으로 안내한다.
if (/KAKAOTALK/i.test(navigator.userAgent)) {
  const bar = document.createElement("div");
  bar.style.cssText = "background:#241f10;border:1px solid var(--warn);color:var(--fg);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;line-height:1.4;";
  const msg = document.createElement("span");
  msg.style.flex = "1";
  msg.textContent = "카카오톡 브라우저에선 마이크 허용 창이 계속 떠요. 크롬으로 열면 한 번만 허용하면 돼요.";
  const btn = document.createElement("button");
  btn.textContent = "크롬으로 열기";
  btn.style.cssText = "min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--warn);background:transparent;color:var(--warn);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;";
  btn.onclick = () => {
    location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent("https://vaulted-bus-346411.web.app/look");
  };
  bar.appendChild(msg); bar.appendChild(btn);
  document.body.insertBefore(bar, $("captionArea"));
}

// ----- 듣기 (실시간 자막) -----
let sr = null, listening = false, finals = [];

function updateListenUI() {
  $("listenBtn").classList.toggle("on", listening);
  $("listenBtn").innerHTML = listening
    ? '<span class="dot">🔴</span> 듣는 중… (누르면 끄기)'
    : '<span class="dot">🟢</span> 듣기 켜기';
}

function renderCaption(interim) {
  const area = $("captionArea");
  area.innerHTML = "";
  if (!finals.length && !interim) {
    area.innerHTML = '<span class="hint">' + (listening
      ? "말소리를 기다리고 있어요…"
      : "아래 [듣기]를 켜면 상대방 말이 여기에 큰 글씨로 떠요") + "</span>";
    return;
  }
  finals.slice(-3).forEach((t) => {
    const d = document.createElement("div");
    d.className = "final";
    d.textContent = t;
    area.appendChild(d);
  });
  if (interim) {
    const d = document.createElement("div");
    d.className = "interim";
    d.textContent = interim;
    area.appendChild(d);
  }
  area.scrollTop = area.scrollHeight;
}

function startSR() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  sr = new SR();
  sr.lang = "ko-KR";
  sr.interimResults = true;
  sr.continuous = true;
  sr.onresult = (e) => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) {
        if (t.trim()) { finals.push(t.trim()); vibe(60); }
      } else interim += t;
    }
    renderCaption(interim);
  };
  sr.onerror = (e) => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      listening = false;
      updateListenUI();
      $("captionArea").innerHTML = '<span class="hint">마이크 권한이 필요해요. 브라우저 설정에서 허용해 주세요.<br>자막 없이도 아래 [말하기]는 쓸 수 있어요.</span>';
    }
  };
  sr.onend = () => {
    // 브라우저가 인식을 자동 종료해도, 듣기 상태면 다시 시작 (마주톡 패턴 + 연속 듣기)
    if (listening) { try { sr.start(); } catch (_) {} }
    else updateListenUI();
  };
  try { sr.start(); } catch (_) {}
}

$("listenBtn").addEventListener("click", () => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    $("captionArea").innerHTML = '<span class="hint">이 브라우저는 자막 기능을 지원하지 않아요. (크롬/삼성인터넷 권장)<br>아래 [말하기]는 그대로 쓸 수 있어요.</span>';
    return;
  }
  if (listening) { listening = false; try { sr.stop(); } catch (_) {} updateListenUI(); return; }
  listening = true;
  updateListenUI();
  renderCaption("");
  startSR();
});

// ----- 자주 쓰는 말 -----
const DEFAULT_PHRASES = ["안녕하세요", "감사합니다", "천천히 말씀해 주세요", "글로 써주시겠어요?", "네", "아니요", "잠시만요", "얼마예요?"];
function getPhrases() {
  try {
    const raw = JSON.parse(localStorage.getItem("look_phrases"));
    return Array.isArray(raw) && raw.length ? raw : DEFAULT_PHRASES.slice();
  } catch (_) { return DEFAULT_PHRASES.slice(); }
}
function setPhrases(list) { localStorage.setItem("look_phrases", JSON.stringify(list)); }
function renderPhrases() {
  const row = $("phraseRow");
  row.innerHTML = "";
  getPhrases().forEach((p) => {
    const b = document.createElement("button");
    b.textContent = p;
    b.onclick = () => speak(p, true); // pinned 캐시
    row.appendChild(b);
  });
  const add = document.createElement("button");
  add.textContent = "＋ 저장";
  add.style.color = "var(--dim)";
  add.onclick = () => {
    const t = $("sayInput").value.trim();
    if (!t) { toast("입력창에 문장을 쓴 뒤 누르면 저장돼요"); return; }
    const list = getPhrases();
    if (list.includes(t)) { toast("이미 저장된 문장이에요"); return; }
    list.push(t);
    setPhrases(list);
    renderPhrases();
    toast("자주 쓰는 말에 저장했어요");
  };
  row.appendChild(add);
}
renderPhrases();

// ----- 설정 -----
function renderSettings() {
  renderVoiceGrid($("setGrid"), state.voice, (id) => {
    state.voice = id;
    localStorage.setItem("look_voice", id);
  });
  $("fontTgl").classList.toggle("on", state.font === "xxl");
  $("fontTgl").textContent = state.font === "xxl" ? "아주 크게 ✓" : "아주 크게";
  $("vibeTgl").classList.toggle("on", state.vibe);
  $("vibeTgl").textContent = state.vibe ? "켜짐" : "꺼짐";
  const list = $("phraseList");
  list.innerHTML = "";
  getPhrases().forEach((p, i) => {
    const row = document.createElement("div");
    const sp = document.createElement("span");
    sp.textContent = p;
    const del = document.createElement("button");
    del.textContent = "삭제";
    del.onclick = () => {
      const arr = getPhrases();
      arr.splice(i, 1);
      setPhrases(arr);
      renderSettings();
      renderPhrases();
    };
    row.appendChild(sp); row.appendChild(del);
    list.appendChild(row);
  });
}
$("settingsBtn").addEventListener("click", () => { renderSettings(); $("settings").classList.add("on"); });
$("setClose").addEventListener("click", () => { $("settings").classList.remove("on"); });
$("fontTgl").addEventListener("click", () => {
  state.font = state.font === "xxl" ? "xl" : "xxl";
  localStorage.setItem("look_font", state.font);
  document.body.classList.toggle("font-xxl", state.font === "xxl");
  renderSettings();
});
$("vibeTgl").addEventListener("click", () => {
  state.vibe = !state.vibe;
  localStorage.setItem("look_vibe", state.vibe ? "on" : "off");
  renderSettings();
});

// 데모 모드 화면 연출 (스크린샷 촬영용)
if (SHOT === "talk") {
  listening = true;
  updateListenUI();
  finals = ["어서오세요", "찾으시는 거 있으세요?"];
  renderCaption("");
  $("sayInput").value = "이거 3개 주세요";
} else if (SHOT === "greet") {
  $("greetCard").classList.add("on");
}
</script>
