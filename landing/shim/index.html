<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>쉼 · 마음 편해지는 소리</title>
<meta name="description" content="파동, 자연소리, 포근한 피아노를 섞어 듣는 쉼의 시간. 메타루카의 그림과 함께.">
<meta property="og:title" content="쉼 · 마음 편해지는 소리">
<meta property="og:description" content="파동 · 자연소리 · 포근한 피아노. 이어폰 끼고, 잠깐 쉬어가요.">
<meta property="og:image" content="https://vaulted-bus-346411.web.app/shim/og.jpg">
<meta property="og:url" content="https://vaulted-bus-346411.web.app/shim">
<meta property="og:type" content="website">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root {
    --ink: #f6efe6;
    --dim: rgba(246, 239, 230, 0.66);
    --line: rgba(246, 239, 230, 0.18);
    --panel: rgba(40, 30, 22, 0.5);
    --accent: #ffc58a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0f16; color: var(--ink);
    word-break: keep-all; font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }

  /* 배경 그림 두 장을 번갈아 크로스페이드 */
  .bg { position: fixed; inset: -4%; background-size: cover; background-position: center; opacity: 0;
    transition: opacity 3s ease; animation: drift 60s ease-in-out infinite alternate; }
  .bg.on { opacity: 1; }
  @keyframes drift { from { transform: scale(1); } to { transform: scale(1.08) translateY(-1.5%); } }
  .shade { position: fixed; inset: 0; background:
    linear-gradient(to bottom, rgba(20,16,12,.35), rgba(20,16,12,0) 30%, rgba(20,16,12,0) 60%, rgba(20,16,12,.55)); }

  main { position: relative; z-index: 1; height: 100%; max-width: 520px; margin: 0 auto;
    display: flex; flex-direction: column; padding: max(24px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom)); }
  header { text-align: center; }
  .logo { letter-spacing: .5em; font-size: 13px; color: var(--accent); margin: 0 0 6px; padding-left: .5em; }
  #scene-name { margin: 0; font-size: clamp(28px, 8vw, 40px); font-weight: 600; text-shadow: 0 2px 20px rgba(0,0,0,.5); }
  #scene-line { margin: 6px 0 0; color: var(--dim); font-size: 14px; }

  .center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  #play { width: 96px; height: 96px; border-radius: 50%; background: rgba(255,255,255,.14);
    border: 1px solid rgba(255,255,255,.4); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    display: grid; place-items: center; transition: transform .2s, background .3s; }
  #play:hover { background: rgba(255,255,255,.22); }
  #play:active { transform: scale(.95); }
  #play svg { width: 34px; height: 34px; fill: var(--ink); }
  #play .ic-pause { display: none; }
  #play.playing .ic-play { display: none; }
  #play.playing .ic-pause { display: block; }
  #play.playing { animation: breathe 8s ease-in-out infinite; }
  @keyframes breathe { 50% { box-shadow: 0 0 0 18px rgba(255,255,255,.06); } }
  .hint { font-size: 13px; color: var(--dim); margin: 0; text-align: center; }
  body.started .hint { opacity: 0; transition: opacity 2s; }
  #remain { font-size: 13px; color: var(--dim); min-height: 1.2em; margin: 0; }

  .dock { background: var(--panel); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--line); border-radius: 20px; padding: 12px; }
  #cards { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  #cards::-webkit-scrollbar { display: none; }
  .card { flex: 0 0 auto; width: 76px; display: flex; flex-direction: column; align-items: center; gap: 6px;
    font-size: 12px; color: var(--dim); }
  .thumb { width: 64px; height: 64px; border-radius: 14px; background-size: cover; background-position: center;
    border: 2px solid transparent; transition: border-color .3s; }
  .card.sel { color: var(--ink); }
  .card.sel .thumb { border-color: var(--accent); }

  .row { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; gap: 8px; }
  .chips { display: flex; gap: 6px; }
  .chip { font-size: 12px; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); }
  .chip.sel { border-color: var(--accent); color: var(--ink); }
  #mixer-toggle { font-size: 12px; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); }
  body.mixer-open #mixer-toggle { color: var(--ink); border-color: var(--accent); }

  #mixer { display: none; margin-top: 12px; }
  body.mixer-open #mixer { display: grid; gap: 10px; }
  #mixer label { display: grid; grid-template-columns: 64px 1fr; align-items: center; font-size: 13px; color: var(--dim); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .credit { text-align: center; font-size: 11px; color: rgba(246,239,230,.4); margin: 10px 0 0; }

  /* 듣는 중엔 패널이 내려가고 그림 전체가 드러남. 화면을 톡 치면 다시 올라옴 */
  header, #play, #remain, .dock, .credit { transition: opacity 1.2s ease, transform 1.2s ease; }
  body.immersed header, body.immersed #remain, body.immersed .credit { opacity: 0; }
  body.immersed #play { opacity: 0; }
  /* 숨은 상태에선 그림 전체를 액자처럼 (돛단배·모닥불 둘 다), 뒤는 흐리게 */
  .bg { transition: opacity 3s ease, filter 1.2s ease; }
  body.immersed .bg { filter: blur(24px) brightness(.55); }
  #frame { position: fixed; inset: max(20px, env(safe-area-inset-top)) 12px max(20px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    opacity: 0; transition: opacity 1.2s ease; pointer-events: none; }
  #frame img { max-width: 100%; max-height: calc(100% - 64px); object-fit: contain; display: block;
    box-shadow: 0 12px 36px rgba(0,0,0,.5); }
  body.immersed #frame { opacity: 1; }
  /* 액자 바로 아래 작품 캡션 */
  #caption { text-align: center; font-size: 14px; letter-spacing: .02em; color: rgba(255,240,225,.88); line-height: 1.6;
    text-shadow: 0 1px 8px rgba(0,0,0,.6); opacity: 0; transition: opacity 1.5s ease .6s; }
  #caption span { font-size: 11px; letter-spacing: .25em; color: rgba(255,214,170,.75); }
  body.immersed #caption { opacity: 1; }
  body.immersed .dock { opacity: 0; transform: translateY(calc(100% + 80px)); pointer-events: none; }
  #toast { position: fixed; left: 50%; top: max(24px, env(safe-area-inset-top)); transform: translateX(-50%);
    font-size: 12px; color: var(--dim); background: rgba(20,14,10,.45); padding: 6px 12px; border-radius: 999px;
    opacity: 0; transition: opacity 1s; pointer-events: none; z-index: 2; white-space: nowrap; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="bg" id="bg0"></div>
<div class="bg" id="bg1"></div>
<div class="shade"></div>
<div id="frame"><img id="frame-img" alt=""><div id="caption"></div></div>

<main>
  <header>
    <p class="logo">쉼</p>
    <h1 id="scene-name">불멍</h1>
    <p id="scene-line"></p>
  </header>

  <div class="center">
    <button id="play" aria-label="듣기">
      <svg class="ic-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>
      <svg class="ic-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
    </button>
    <p class="hint">🎧 이어폰을 끼면 파동이 더 잘 느껴져요</p>
    <p id="remain"></p>
  </div>

  <div class="dock">
    <div id="cards"></div>
    <div class="row">
      <div class="chips">
        <button class="chip" data-min="15">15분</button>
        <button class="chip sel" data-min="30">30분</button>
        <button class="chip" data-min="60">60분</button>
        <button class="chip" data-min="0">계속</button>
      </div>
      <button id="mixer-toggle">믹서</button>
    </div>
    <div id="mixer">
      <label>파동 <input type="range" id="lv-wave" min="0" max="100" value="25"></label>
      <label>자연소리 <input type="range" id="lv-nature" min="0" max="100" value="70"></label>
      <label>음악 <input type="range" id="lv-music" min="0" max="100" value="60"></label>
    </div>
  </div>
  <div id="toast">화면을 톡 치면 메뉴가 다시 나와요</div>
  <p class="credit">그림 · 메타루카 &nbsp;|&nbsp; 소리 출처는 <a href="/shim/sounds/CREDITS.md" style="color:inherit">여기</a></p>
</main>

<script type="module" src="/shim/app.js?v=14"></script>
</body>
</html>
