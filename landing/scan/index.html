<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>my scan2677 — 사진 속 글자를 텍스트로</title>
<meta name="description" content="사진을 올리면 글자를 뽑아드려요. 문서·손글씨·번역까지 한 번에. my scan2677" />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://vaulted-bus-346411.web.app/scan" />
<meta property="og:title" content="my scan2677 — 사진 속 글자를 텍스트로" />
<meta property="og:description" content="사진 한 장이면 문서·손글씨·번역까지. 찍어서 올리면 글자를 뽑아드려요." />
<meta property="og:image" content="https://vaulted-bus-346411.web.app/scan/og.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="my scan2677 — 사진 속 글자를 텍스트로" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="my scan2677 — 사진 속 글자를 텍스트로" />
<meta name="twitter:description" content="사진 한 장이면 문서·손글씨·번역까지. 찍어서 올리면 글자를 뽑아드려요." />
<meta name="twitter:image" content="https://vaulted-bus-346411.web.app/scan/og.png" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  :root{
    --bg:#0e0f12; --bg-soft:#16181d; --fg:#f4f4f5; --fg-dim:#a1a1aa;
    --line:#26272e; --accent:#b794ff; --accent-2:#7c5cff; --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
    font-family:"Pretendard Variable", Pretendard, -apple-system, system-ui, Roboto, sans-serif;
    line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button{font:inherit;cursor:pointer}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px 60px}

  header{position:sticky;top:0;z-index:10;background:rgba(14,15,18,.85);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line)}
  .head-inner{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;height:52px;padding:0 16px}
  .back{color:var(--fg-dim);font-size:14px}
  h1{font-size:17px;margin:0;font-weight:800;letter-spacing:-.01em}

  .tabs{display:flex;gap:6px;margin:16px 0 12px}
  .tab{flex:1;padding:10px 0;border-radius:12px;border:1px solid var(--line);background:var(--bg-soft);
    color:var(--fg-dim);font-weight:700;font-size:14px}
  .tab.on{background:var(--accent-2);border-color:var(--accent-2);color:#fff}

  .lang-row{display:none;align-items:center;gap:8px;margin-bottom:12px;font-size:14px;color:var(--fg-dim)}
  .lang-row.show{display:flex}
  .lang-row select{background:var(--bg-soft);color:var(--fg);border:1px solid var(--line);
    border-radius:10px;padding:8px 10px;font:inherit}

  .drop{border:2px dashed var(--line);border-radius:var(--radius);background:var(--bg-soft);
    padding:36px 16px;text-align:center;color:var(--fg-dim);font-size:15px;cursor:pointer}
  .drop b{color:var(--fg)}
  .drop .icon{font-size:34px;display:block;margin-bottom:8px}

  .preview{display:none;margin-top:12px}
  .preview.show{display:block}
  .preview img{width:100%;border-radius:var(--radius);border:1px solid var(--line);max-height:320px;object-fit:contain;background:#000}
  .preview .re{margin-top:8px;background:transparent;border:1px solid var(--line);color:var(--fg-dim);
    border-radius:10px;padding:8px 12px;font-size:13px}

  .go{display:block;width:100%;margin-top:14px;padding:15px 0;border:none;border-radius:14px;
    background:var(--accent-2);color:#fff;font-weight:800;font-size:16px}
  .go:disabled{opacity:.45}

  .status{display:none;margin-top:14px;text-align:center;color:var(--fg-dim);font-size:14px}
  .status.show{display:block}
  .spin{display:inline-block;width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent);
    border-radius:50%;animation:sp 1s linear infinite;vertical-align:-4px;margin-right:8px}
  @keyframes sp{to{transform:rotate(360deg)}}

  .errbox{display:none;margin-top:14px;background:#2a1518;border:1px solid #5c2b31;color:#ffb4bb;
    border-radius:12px;padding:14px;font-size:14px}
  .errbox.show{display:block}
  .errbox button{margin-top:10px;background:#5c2b31;border:none;color:#fff;border-radius:10px;padding:8px 14px;font-size:13px}

  .result{display:none;margin-top:18px}
  .result.show{display:block}
  .result label{font-size:13px;color:var(--fg-dim);display:block;margin:12px 0 6px;font-weight:700}
  textarea{width:100%;min-height:120px;background:var(--bg-soft);color:var(--fg);border:1px solid var(--line);
    border-radius:12px;padding:12px;font:inherit;font-size:15px;resize:vertical}
  .act-row{display:flex;gap:8px;margin-top:12px}
  .act{flex:1;padding:11px 0;border-radius:12px;border:1px solid var(--line);background:var(--bg-soft);
    color:var(--fg);font-weight:700;font-size:14px}
  .act.primary{background:var(--accent-2);border-color:var(--accent-2);color:#fff}

  .hist{margin-top:34px}
  .hist h2{font-size:15px;color:var(--fg-dim);margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
  .hist h2 button{background:none;border:none;color:var(--fg-dim);font-size:12px;text-decoration:underline}
  .hist-item{background:var(--bg-soft);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
    margin-bottom:8px;font-size:14px}
  .hist-item .meta{color:var(--fg-dim);font-size:12px;margin-bottom:4px;display:flex;justify-content:space-between}
  .hist-item .meta button{background:none;border:none;color:var(--fg-dim);font-size:12px}
  .hist-item .txt{white-space:pre-wrap;word-break:break-all;max-height:72px;overflow:hidden;cursor:pointer}
  .hist-item.open .txt{max-height:none}
  .hist-empty{color:var(--fg-dim);font-size:13px;text-align:center;padding:14px 0}

  .notice{margin-top:30px;color:var(--fg-dim);font-size:12px;text-align:center}
</style>
</head>
<body>

<header>
  <div class="head-inner">
    <a class="back" href="/">← 다락방</a>
    <h1>📷 my scan2677</h1>
  </div>
</header>

<main class="wrap">
  <div class="tabs">
    <button class="tab on" data-mode="document">문서</button>
    <button class="tab" data-mode="handwriting">손글씨</button>
    <button class="tab" data-mode="translate">번역</button>
  </div>

  <div class="lang-row" id="langRow">
    <span>번역할 언어</span>
    <select id="langSel">
      <option value="ko" selected>한국어로</option>
      <option value="en">영어로</option>
      <option value="ja">일본어로</option>
      <option value="zh">중국어로</option>
    </select>
  </div>

  <div class="drop" id="drop">
    <span class="icon">📸</span>
    <b>사진을 선택하거나 촬영하세요</b><br/>
    문서 · 간판 · 손글씨 메모 무엇이든 좋아요
  </div>
  <input type="file" id="file" accept="image/*" hidden />

  <div class="preview" id="preview">
    <img id="pimg" alt="선택한 사진 미리보기" />
    <button class="re" id="rebtn">다른 사진 선택</button>
  </div>

  <button class="go" id="go" disabled>스캔하기</button>

  <div class="status" id="status"><span class="spin"></span>글자를 읽고 있어요…</div>

  <div class="errbox" id="errbox">
    <div id="errmsg"></div>
    <button id="retry">다시 시도</button>
  </div>

  <div class="result" id="result">
    <label for="outText">추출된 글자 (수정 가능)</label>
    <textarea id="outText"></textarea>
    <div id="transWrap" style="display:none">
      <label for="outTrans">번역</label>
      <textarea id="outTrans"></textarea>
    </div>
    <div class="act-row">
      <button class="act primary" id="copyBtn">복사</button>
      <button class="act" id="shareBtn">공유</button>
      <button class="act" id="dlBtn">.txt 저장</button>
    </div>
  </div>

  <div class="hist">
    <h2>최근 스캔 기록 <button id="clearHist">전체 삭제</button></h2>
    <div id="histList"></div>
  </div>

  <p class="notice">사진은 글자 인식 처리에만 사용되고 어디에도 저장되지 않아요.<br/>기록은 이 휴대폰 브라우저에만 저장됩니다.</p>
</main>

<script>
var SCAN_API = "https://small-recipe-9345.atlia0318.workers.dev/scan";
var HIST_KEY = "myscan2677_history";
var MODE_LABEL = { document: "문서", handwriting: "손글씨", translate: "번역" };

var mode = "document";
var imageB64 = null;     // base64 (접두사 없음)

var $ = function (id) { return document.getElementById(id); };

// --- 탭 ---
document.querySelectorAll(".tab").forEach(function (t) {
  t.addEventListener("click", function () {
    document.querySelectorAll(".tab").forEach(function (x) { x.classList.remove("on"); });
    t.classList.add("on");
    mode = t.dataset.mode;
    $("langRow").classList.toggle("show", mode === "translate");
  });
});

// --- 사진 선택 + 축소 ---
$("drop").addEventListener("click", function () { $("file").click(); });
$("rebtn").addEventListener("click", function () { $("file").click(); });

$("file").addEventListener("change", function () {
  var f = this.files && this.files[0];
  if (!f) return;
  var img = new Image();
  var url = URL.createObjectURL(f);
  img.onload = function () {
    var MAX = 1600;
    var w = img.width, h = img.height;
    if (Math.max(w, h) > MAX) {
      var r = MAX / Math.max(w, h);
      w = Math.round(w * r); h = Math.round(h * r);
    }
    var cv = document.createElement("canvas");
    cv.width = w; cv.height = h;
    cv.getContext("2d").drawImage(img, 0, 0, w, h);
    var dataUrl = cv.toDataURL("image/jpeg", 0.85);
    imageB64 = dataUrl.split(",")[1];
    $("pimg").src = dataUrl;
    $("preview").classList.add("show");
    $("drop").style.display = "none";
    $("go").disabled = false;
    hide($("result")); hide($("errbox"));
    URL.revokeObjectURL(url);
  };
  img.onerror = function () {
    URL.revokeObjectURL(url);
    showError("이 사진은 열 수 없어요. 다른 사진으로 시도해주세요.");
  };
  img.src = url;
  this.value = "";
});

// --- 스캔 호출 ---
$("go").addEventListener("click", doScan);
$("retry").addEventListener("click", doScan);

function doScan() {
  if (!imageB64) return;
  hide($("errbox")); hide($("result"));
  $("status").classList.add("show");
  $("go").disabled = true;

  fetch(SCAN_API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ image: imageB64, mode: mode, targetLang: $("langSel").value, mime: "image/jpeg" }),
  })
    .then(function (res) { return res.json().then(function (d) { return { ok: res.ok, d: d }; }); })
    .then(function (r) {
      $("status").classList.remove("show");
      $("go").disabled = false;
      if (!r.ok || r.d.error) { showError(r.d.error || "처리에 실패했어요. 잠시 후 다시 시도해주세요."); return; }
      if (!r.d.text && !r.d.translation) { showError("사진에서 글자를 찾지 못했어요. 글자가 잘 보이게 다시 찍어보세요."); return; }
      $("outText").value = r.d.text || "";
      $("outTrans").value = r.d.translation || "";
      $("transWrap").style.display = mode === "translate" && r.d.translation ? "block" : "none";
      $("result").classList.add("show");
      saveHistory(r.d);
    })
    .catch(function () {
      $("status").classList.remove("show");
      $("go").disabled = false;
      showError("인터넷 연결을 확인하고 다시 시도해주세요.");
    });
}

function showError(msg) {
  $("errmsg").textContent = msg;
  $("errbox").classList.add("show");
}
function hide(el) { el.classList.remove("show"); }

// --- 결과: 복사 / 공유 / 다운로드 ---
function currentText() {
  var t = $("outText").value.trim();
  var tr = $("outTrans").value.trim();
  return tr && $("transWrap").style.display !== "none" ? t + "\n\n[번역]\n" + tr : t;
}

$("copyBtn").addEventListener("click", function () {
  navigator.clipboard.writeText(currentText()).then(function () {
    $("copyBtn").textContent = "복사됨!";
    setTimeout(function () { $("copyBtn").textContent = "복사"; }, 1500);
  });
});

$("shareBtn").addEventListener("click", function () {
  if (navigator.share) {
    navigator.share({ text: currentText() }).catch(function () {});
  } else {
    navigator.clipboard.writeText(currentText());
    $("shareBtn").textContent = "복사됨!";
    setTimeout(function () { $("shareBtn").textContent = "공유"; }, 1500);
  }
});

$("dlBtn").addEventListener("click", function () {
  var d = new Date();
  var pad = function (n) { return String(n).padStart(2, "0"); };
  var name = "scan_" + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + "_" + pad(d.getHours()) + pad(d.getMinutes()) + ".txt";
  var blob = new Blob([currentText()], { type: "text/plain;charset=utf-8" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
});

// --- 기록 (localStorage, 최근 20건, 텍스트만) ---
function loadHistory() {
  try { return JSON.parse(localStorage.getItem(HIST_KEY)) || []; } catch (e) { return []; }
}
function saveHistory(res) {
  var list = loadHistory();
  list.unshift({ t: Date.now(), mode: mode, text: res.text || "", translation: res.translation || "" });
  if (list.length > 20) list = list.slice(0, 20);
  try { localStorage.setItem(HIST_KEY, JSON.stringify(list)); } catch (e) {}
  renderHistory();
}
function renderHistory() {
  var list = loadHistory();
  var box = $("histList");
  box.innerHTML = "";
  if (!list.length) { box.innerHTML = '<div class="hist-empty">아직 스캔 기록이 없어요</div>'; return; }
  list.forEach(function (item, i) {
    var d = new Date(item.t);
    var pad = function (n) { return String(n).padStart(2, "0"); };
    var when = (d.getMonth() + 1) + "/" + d.getDate() + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
    var el = document.createElement("div");
    el.className = "hist-item";
    var meta = document.createElement("div");
    meta.className = "meta";
    var span = document.createElement("span");
    span.textContent = when + " · " + (MODE_LABEL[item.mode] || item.mode);
    meta.appendChild(span);
    var del = document.createElement("button");
    del.textContent = "삭제";
    del.addEventListener("click", function (ev) {
      ev.stopPropagation();
      var l = loadHistory(); l.splice(i, 1);
      try { localStorage.setItem(HIST_KEY, JSON.stringify(l)); } catch (e) {}
      renderHistory();
    });
    meta.appendChild(del);
    var txt = document.createElement("div");
    txt.className = "txt";
    txt.textContent = item.text + (item.translation ? "\n\n[번역]\n" + item.translation : "");
    txt.addEventListener("click", function () { el.classList.toggle("open"); });
    el.appendChild(meta); el.appendChild(txt);
    box.appendChild(el);
  });
}
$("clearHist").addEventListener("click", function () {
  if (!loadHistory().length) return;
  if (confirm("스캔 기록을 모두 삭제할까요?")) {
    localStorage.removeItem(HIST_KEY);
    renderHistory();
  }
});

renderHistory();
</script>

</body>
</html>
