<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다락방 식구들 상황판</title>
<style>
  :root {
    --bg: #050814; --ink: #e8ecff; --sub: #8690b8; --dim: #4a5380;
    --glass: rgba(16, 22, 48, .72); --edge: rgba(120, 140, 255, .22);
    --cyan: #3ee6ff; --violet: #9b7bff; --pink: #ff5fd2;
    --ok: #2dffb3; --quiet: #5d678f; --err: #ff4d6d; --warn: #ffc857;
    --mono: "Cascadia Code", "Consolas", "D2Coding", monospace;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); color-scheme: dark; scrollbar-color: rgba(120, 140, 255, .45) var(--bg); }
  body {
    margin: 0; min-height: 100vh; color: var(--ink);
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    font-size: 15px; line-height: 1.45;
    background:
      radial-gradient(900px 520px at 50% 46%, rgba(110, 80, 255, .20), transparent 70%),
      radial-gradient(700px 400px at 8% 0%, rgba(62, 230, 255, .12), transparent 70%),
      radial-gradient(700px 420px at 100% 100%, rgba(255, 95, 210, .10), transparent 70%),
      linear-gradient(rgba(120, 140, 255, .055) 1px, transparent 1px) 0 0 / 44px 44px,
      linear-gradient(90deg, rgba(120, 140, 255, .055) 1px, transparent 1px) 0 0 / 44px 44px,
      var(--bg);
  }
  /* 화면 전체에 얇은 주사선 */
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 9;
    background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .022) 0 1px, transparent 1px 3px);
  }
  body { overflow-x: hidden; }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 22px 16px 48px; }

  /* ── 머리 ── */
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 24px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .logo {
    width: 44px; height: 44px; border-radius: 12px; display: grid; place-content: center;
    font: 700 20px var(--mono); color: #06101f;
    background: linear-gradient(135deg, var(--cyan), var(--violet) 60%, var(--pink));
    box-shadow: 0 0 24px rgba(120, 120, 255, .55);
  }
  h1 {
    margin: 0; font-size: 24px; letter-spacing: -.02em;
    background: linear-gradient(90deg, #fff, var(--cyan) 55%, var(--violet));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .tag { font: 12px var(--mono); color: var(--sub); letter-spacing: .12em; }
  .live {
    display: inline-flex; align-items: center; gap: 6px; margin-left: 8px; padding: 2px 9px;
    border: 1px solid rgba(45, 255, 179, .45); border-radius: 99px;
    font: 700 11px var(--mono); color: var(--ok); letter-spacing: .14em; vertical-align: middle;
  }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 10px var(--ok); animation: blink 1.4s ease-in-out infinite; }
  .live.off { color: var(--err); border-color: rgba(255, 77, 109, .5); }
  .live.off i { background: var(--err); box-shadow: 0 0 10px var(--err); animation: none; }
  @keyframes blink { 50% { opacity: .25; } }

  .stats { display: flex; gap: 10px; margin-left: auto; flex-wrap: wrap; }
  .stat {
    position: relative; min-width: 118px; padding: 9px 16px 10px; border-radius: 12px;
    background: var(--glass); border: 1px solid var(--edge); backdrop-filter: blur(8px);
  }
  .stat::before { content: ""; position: absolute; left: 14px; right: 14px; top: -1px; height: 2px; border-radius: 2px; background: var(--k, var(--cyan)); box-shadow: 0 0 12px var(--k, var(--cyan)); }
  .stat b { display: block; font: 700 26px var(--mono); color: var(--k, var(--cyan)); text-shadow: 0 0 16px var(--k, var(--cyan)); }
  .stat span { font-size: 12px; color: var(--sub); }

  .cmd {
    margin-top: 14px; padding: 9px 14px; border-radius: 10px; display: flex; gap: 10px; flex-wrap: wrap;
    font: 13px var(--mono); background: rgba(4, 7, 20, .85); border: 1px solid var(--edge); color: var(--sub);
  }
  .cmd .p { color: var(--ok); }
  .cmd .c { color: var(--ink); }
  .cmd .c::after { content: "▍"; color: var(--cyan); animation: blink 1s steps(1) infinite; }
  .cmd #asof { margin-left: auto; color: var(--cyan); }

  .banner {
    margin-top: 10px; padding: 9px 14px; border-radius: 10px; font-size: 14px;
    color: var(--warn); background: rgba(255, 200, 87, .08); border: 1px solid rgba(255, 200, 87, .4);
    box-shadow: 0 0 18px rgba(255, 200, 87, .12) inset;
  }
  .banner::before { content: "⚠ "; }
  .banner.dead { color: #ff8fa3; background: rgba(255, 77, 109, .10); border-color: rgba(255, 77, 109, .5); box-shadow: 0 0 18px rgba(255, 77, 109, .15) inset; }
  .banner[hidden] { display: none; }

  /* ── 무대 ── */
  .stage { position: relative; height: 680px; margin-top: 14px; }
  .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .wire { fill: none; vector-effect: non-scaling-stroke; stroke: var(--dim); stroke-width: 1; stroke-dasharray: 2 7; opacity: .7; }
  .wire.glow { stroke: var(--c); stroke-width: 6; stroke-dasharray: none; opacity: .13; filter: blur(3px); }
  .wire.today { stroke: var(--c); stroke-width: 1.6; stroke-dasharray: 3 9; opacity: .95; animation: flow 1.6s linear infinite; }
  .wire.live { stroke: var(--c); stroke-width: 2.6; stroke-dasharray: 10 8; opacity: 1; animation: flow .5s linear infinite; filter: drop-shadow(0 0 5px var(--c)); }
  .wire.bad { stroke: var(--err); stroke-width: 1.6; stroke-dasharray: 2 6; opacity: .9; }
  @keyframes flow { to { stroke-dashoffset: -36; } }

  .node { position: absolute; transform: translate(-50%, -50%); }

  .core { left: 50%; top: 50%; width: 170px; height: 170px; display: grid; place-content: center; text-align: center; }
  .core::before, .core::after, .core .ring { content: ""; position: absolute; inset: 0; border-radius: 50%; }
  .core::before { border: 2px dashed rgba(62, 230, 255, .55); animation: spin 22s linear infinite; }
  .core::after { inset: 14px; border: 1px solid rgba(155, 123, 255, .6); border-top-color: var(--pink); border-bottom-color: var(--cyan); animation: spin 7s linear infinite reverse; }
  .core .ring { inset: -22px; border: 1px solid rgba(120, 140, 255, .18); animation: pulse 3.2s ease-out infinite; }
  .core .orb {
    position: relative; width: 112px; height: 112px; border-radius: 50%; display: grid; place-content: center;
    background: radial-gradient(circle at 35% 30%, #2b3470, #0a0f2b 70%);
    box-shadow: 0 0 40px rgba(110, 90, 255, .65), inset 0 0 22px rgba(62, 230, 255, .35);
  }
  .core .orb img { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
  .core .cap { position: absolute; left: 50%; top: 100%; transform: translate(-50%, 14px); display: grid; justify-items: center; white-space: nowrap; }
  .core b { font-size: 17px; letter-spacing: .04em; text-shadow: 0 0 14px var(--cyan); }
  .core span { font: 10px var(--mono); color: var(--cyan); letter-spacing: .2em; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0% { transform: scale(.82); opacity: .9; } 100% { transform: scale(1.35); opacity: 0; } }

  .card {
    width: 264px; padding: 12px 14px 12px; border-radius: 14px;
    background: var(--glass); backdrop-filter: blur(10px);
    border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, .03) inset, 0 10px 34px rgba(0, 0, 0, .45);
    transition: transform .2s, box-shadow .2s;
  }
  .card:hover { transform: translate(-50%, -50%) scale(1.03); }
  .card.active { box-shadow: 0 0 26px color-mix(in srgb, var(--c) 38%, transparent), 0 10px 34px rgba(0, 0, 0, .45); }
  .card.error { border-color: var(--err); box-shadow: 0 0 26px rgba(255, 77, 109, .35), 0 10px 34px rgba(0, 0, 0, .45); }
  .card.quiet, .card.unreadable { border-color: rgba(120, 140, 255, .2); }
  /* 모서리 꺾쇠 */
  .card::before, .card::after { content: ""; position: absolute; width: 12px; height: 12px; border: 2px solid var(--c); opacity: .9; }
  .card::before { left: -1px; top: -1px; border-right: 0; border-bottom: 0; border-radius: 14px 0 0 0; }
  .card::after { right: -1px; bottom: -1px; border-left: 0; border-top: 0; border-radius: 0 0 14px 0; }
  .card.quiet::before, .card.quiet::after, .card.unreadable::before, .card.unreadable::after { opacity: .35; }

  .top { display: flex; align-items: center; gap: 10px; }
  .ava {
    position: relative; flex: none; width: 66px; height: 66px; margin: -30px 0 0 -6px; border-radius: 50%;
    display: grid; place-content: center; font-weight: 800; font-size: 20px; color: var(--c);
    background: radial-gradient(circle at 50% 35%, #263066, #0a0f2b 75%);
    border: 2px solid var(--c);
    box-shadow: 0 0 16px color-mix(in srgb, var(--c) 65%, transparent), inset 0 0 10px rgba(0, 0, 0, .5);
  }
  .ava img { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
  .active .ava::after { content: ""; position: absolute; inset: -7px; border-radius: 50%; border: 1px dashed var(--c); opacity: .7; animation: spin 9s linear infinite; }
  .quiet .ava, .unreadable .ava { border-color: var(--quiet); box-shadow: none; }
  .quiet .ava img, .unreadable .ava img { filter: grayscale(.75) brightness(.8); }
  .who { min-width: 0; }
  .name { font-size: 17px; font-weight: 700; white-space: nowrap; }
  .role { font-size: 11.5px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .state { margin-left: auto; align-self: flex-start; display: flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 99px; font: 700 10.5px var(--mono); letter-spacing: .06em; white-space: nowrap; color: var(--quiet); border: 1px solid currentColor; }
  .state i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .active .state { color: var(--ok); }
  .active .state i { box-shadow: 0 0 8px var(--ok); animation: blink 1.4s ease-in-out infinite; }
  .error .state { color: var(--err); }
  .unreadable .state { border-style: dashed; }

  .nums { display: flex; align-items: baseline; gap: 10px; margin-top: 10px; font-size: 12.5px; color: var(--sub); }
  .nums span { white-space: nowrap; }
  .nums b { font: 700 22px var(--mono); color: var(--ink); }
  .active .nums b { color: var(--c); text-shadow: 0 0 12px var(--c); }
  .nums .ago { margin-left: auto; font-family: var(--mono); font-size: 12px; }
  .sig { height: 3px; margin-top: 8px; border-radius: 3px; background: rgba(120, 140, 255, .14); overflow: hidden; }
  .sig i { display: block; height: 100%; width: var(--w, 0%); background: linear-gradient(90deg, transparent, var(--c)); box-shadow: 0 0 8px var(--c); }
  .last { margin-top: 8px; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .last::before { content: "› "; color: var(--c); font-family: var(--mono); }
  .extra { margin: 6px 0 0; padding: 0; list-style: none; font: 11.5px var(--mono); color: var(--sub); }
  .extra li + li { margin-top: 2px; }
  .detail { margin-top: 6px; font-size: 12px; color: #ff8fa3; }

  /* ── 일지 ── */
  .logbox { margin-top: 18px; border-radius: 14px; background: rgba(4, 7, 20, .82); border: 1px solid var(--edge); overflow: hidden; }
  .logbox h2 { margin: 0; padding: 9px 16px; font: 700 12px var(--mono); letter-spacing: .16em; color: var(--cyan); border-bottom: 1px solid var(--edge); background: rgba(62, 230, 255, .05); }
  .journal { margin: 0; padding: 4px 0; list-style: none; font: 13px var(--mono); max-height: 330px; overflow: auto; scrollbar-width: thin; scrollbar-color: rgba(120, 140, 255, .45) transparent; }
  .journal li { display: grid; grid-template-columns: 118px 84px 1fr; gap: 10px; padding: 5px 16px; }
  .journal li:hover { background: rgba(120, 140, 255, .07); }
  .journal time { color: var(--sub); }
  .journal .who { color: var(--c); font-weight: 700; text-shadow: 0 0 10px color-mix(in srgb, var(--c) 60%, transparent); }
  .journal .what { color: #c9d1f5; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: "Pretendard", "Malgun Gothic", sans-serif; }
  footer { margin-top: 12px; font: 11.5px var(--mono); color: var(--dim); }

  @media (max-width: 1020px) {
    .stage { height: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(264px, 1fr)); gap: 34px 14px; padding-top: 30px; }
    .stage svg, .core { display: none; }
    .node.card { position: relative; left: auto !important; top: auto !important; transform: none; width: auto; }
    .card:hover { transform: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">D</div>
      <div>
        <h1>다락방 식구들 상황판 <span class="live" id="live"><i></i><span id="live-text">LIVE</span></span></h1>
        <div class="tag">DARAKBANG · FAMILY OPS · 1 PERSON, 7 AGENTS</div>
      </div>
    </div>
    <div class="stats">
      <div class="stat" style="--k: var(--cyan)"><b id="s-today">–</b><span>오늘 한 일</span></div>
      <div class="stat" style="--k: var(--ok)"><b id="s-active">–</b><span>오늘 움직인 식구</span></div>
      <div class="stat" id="s-err-box" style="--k: var(--quiet)"><b id="s-err">–</b><span>오류</span></div>
    </div>
  </header>

  <div class="cmd"><span class="p">~/darakbang $</span><span class="c">family status --live --read-only</span><span id="asof">불러오는 중…</span></div>
  <div class="banner dead" id="dead" hidden></div>
  <div id="warnings"></div>

  <div class="stage" id="stage">
    <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" id="wires"></svg>
    <div class="node core"><i class="ring"></i><div class="orb"><img id="luka-img" alt="" onerror="this.remove()"><div class="cap"><b>루카</b><span>CAPTAIN</span></div></div></div>
  </div>

  <div class="logbox">
    <h2>▸ ACTIVITY LOG · 최근 일지</h2>
    <ul class="journal" id="journal"></ul>
  </div>
  <footer>read-only · 식구들이 남긴 기록을 읽기만 해요. 대화 내용과 이름은 읽지 않아요.</footer>
</div>

<script>
const COLORS = {
  pureum: "#4da3ff", rurik: "#ff9d3c", jujuya: "#ff6fb5", nova: "#a98bff",
  hermi: "#2ff5d0", luna: "#ffe066", clo: "#7dff8a",
};
const STATE_LABEL = { active: "활동 중", quiet: "조용함", error: "오류", unreadable: "기록 못 읽음" };
const LIVE_MS = 10 * 60 * 1000;
const STALE_MS = 3 * 60 * 1000;
const REFRESH_MS = 30 * 1000;
const SIGNAL_FULL_MS = 24 * 3600 * 1000;

// 시연용 파일에는 요약과 그림이 파일 안에 들어 있다 (make_snapshot.py가 넣는다)
const SNAP = window.SNAPSHOT || null;
const SNAP_IMG = window.SNAPSHOT_IMG || {};
const nowMs = () => (SNAP ? new Date(SNAP.generated_at).getTime() : Date.now());
const imgSrc = (id) => SNAP_IMG[id] || `img/${id}.webp`;

const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};
const pad = (n) => String(n).padStart(2, "0");

function when(isoText) {
  if (!isoText) return "기록 없음";
  const d = new Date(isoText), now = new Date(nowMs());
  const min = Math.floor((now - d) / 60000);
  const hm = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  if (min < 1) return "방금";
  if (min < 60) return `${min}분 전`;
  const dayOf = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const days = Math.round((dayOf(now) - dayOf(d)) / 86400000);
  if (days === 0) return `오늘 ${hm}`;
  if (days === 1) return `어제 ${hm}`;
  return `${d.getMonth() + 1}월 ${d.getDate()}일 ${hm}`;
}

// 창이 좁아져도 카드가 화면 밖으로 나가지 않게 가로 반지름을 줄인다
function position(i, n) {
  const a = (-90 + (360 / n) * i) * Math.PI / 180;
  const w = $("stage").clientWidth || 1280;
  const rx = Math.min(39, ((w / 2 - 140) / w) * 100);
  return { x: 50 + rx * Math.cos(a), y: 50 + 37 * Math.sin(a) };
}

// 마지막 소식이 방금이면 꽉 차고, 24시간이 지나면 0이 되는 신호 막대
function signal(lastAt) {
  if (!lastAt) return 0;
  const age = nowMs() - new Date(lastAt).getTime();
  return Math.max(0, Math.min(1, 1 - age / SIGNAL_FULL_MS));
}

// 얼굴 그림. 그림 파일이 없으면 이름 첫 글자가 대신 보인다.
function avatar(id, name) {
  const a = el("div", "ava", name.slice(0, 1));
  const img = new Image();
  img.alt = "";
  img.onerror = () => img.remove();
  img.src = imgSrc(id);
  a.append(img);
  return a;
}

function card(m, pos) {
  const c = el("div", `node card ${m.state}`);
  c.style.setProperty("--c", COLORS[m.id] || "#8aa");
  c.style.left = pos.x + "%";
  c.style.top = pos.y + "%";

  const top = el("div", "top");
  const who = el("div", "who");
  who.append(el("div", "name", m.name), el("div", "role", m.role));
  const st = el("span", "state");
  st.append(el("i"), el("span", null, STATE_LABEL[m.state] || m.state));
  top.append(avatar(m.id, m.name), who, st);
  c.append(top);

  const nums = el("div", "nums");
  const today = el("span");
  today.append("오늘 ", el("b", null, m.today_count == null ? "?" : m.today_count), " 건");
  nums.append(today, el("span", "ago", when(m.last_at)));
  c.append(nums);

  const sig = el("div", "sig"), bar = el("i");
  bar.style.setProperty("--w", Math.round(signal(m.last_at) * 100) + "%");
  sig.append(bar);
  c.append(sig);

  if (m.state !== "unreadable") c.append(el("div", "last", m.last_line || "아직 기록이 없어요"));
  if (m.lines && m.lines.length) {
    const ul = el("ul", "extra");
    m.lines.forEach((t) => ul.append(el("li", null, t)));
    c.append(ul);
  }
  if (m.detail) c.append(el("div", "detail", m.detail));
  return c;
}

function wire(pos, cls, color) {
  const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
  line.setAttribute("x1", 50); line.setAttribute("y1", 50);
  line.setAttribute("x2", pos.x); line.setAttribute("y2", pos.y);
  line.setAttribute("class", "wire " + cls);
  line.style.setProperty("--c", color);
  return line;
}

function setLive(on, text) {
  $("live").classList.toggle("off", !on);
  $("live-text").textContent = text;
}

let lastStatus = null;
function render(s) {
  lastStatus = s;
  const age = nowMs() - new Date(s.generated_at).getTime();
  const g = new Date(s.generated_at);
  $("asof").textContent = `sync ${pad(g.getMonth() + 1)}-${pad(g.getDate())} ${pad(g.getHours())}:${pad(g.getMinutes())}`;
  const stale = age >= STALE_MS;
  const dead = $("dead");
  dead.hidden = !stale;
  if (stale) dead.textContent = `수집이 멈췄어요. 화면의 내용은 ${when(s.generated_at)} 것이에요. 상황판_열기.bat을 다시 실행해 주세요.`;
  setLive(!stale, SNAP ? "SNAPSHOT" : stale ? "OFFLINE" : "LIVE");

  $("s-today").textContent = s.totals.today_count;
  $("s-active").textContent = `${s.totals.active}/${s.members.length}`;
  $("s-err").textContent = s.totals.errors;
  $("s-err-box").style.setProperty("--k", s.totals.errors > 0 ? "var(--err)" : "var(--quiet)");

  $("warnings").replaceChildren(...s.warnings.map((t) => el("div", "banner", t)));

  const stage = $("stage"), wires = $("wires");
  stage.querySelectorAll(".card").forEach((n) => n.remove());
  wires.replaceChildren();
  s.members.forEach((m, i) => {
    const pos = position(i, s.members.length);
    const color = COLORS[m.id] || "#8aa";
    const recent = m.last_at && nowMs() - new Date(m.last_at).getTime() < LIVE_MS;
    const cls = m.state === "error" ? "bad" : recent ? "live" : m.state === "active" ? "today" : "";
    if (cls === "live" || cls === "today") wires.append(wire(pos, "glow", color));
    wires.append(wire(pos, cls, color));
    stage.append(card(m, pos));
  });

  const j = $("journal");
  j.replaceChildren(...s.journal.map((row) => {
    const li = el("li");
    li.style.setProperty("--c", COLORS[row.id] || "#8aa");
    li.append(el("time", null, when(row.at)), el("span", "who", row.name), el("span", "what", row.line));
    return li;
  }));
  if (!s.journal.length) j.append(el("li", null, "아직 기록이 없어요"));
}

async function refresh() {
  if (SNAP) return render(SNAP);
  try {
    const r = await fetch("status.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    render(await r.json());
  } catch (e) {
    const dead = $("dead");
    dead.hidden = false;
    dead.textContent = "수집기가 꺼져 있어요. 상황판_열기.bat으로 열어 주세요.";
    $("asof").textContent = "no signal";
    setLive(false, "OFFLINE");
  }
}
$("luka-img").src = imgSrc("luka");
refresh();
if (!SNAP) setInterval(refresh, REFRESH_MS);
window.addEventListener("resize", () => { if (lastStatus) render(lastStatus); });
</script>
</body>
</html>
