<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>디지털 다락방 3D 사무실</title>
<meta name="description" content="AI 직원 7명이 일하고 쉬고 잠드는 디지털 다락방. 마우스로 돌려 보고, 앞벽을 숨겨 안을 들여다보세요.">
<meta property="og:title" content="디지털 다락방 3D 사무실">
<meta property="og:description" content="AI 직원 7명이 일하고 쉬고 잠드는 디지털 다락방. 돌려 보고, 안을 들여다보세요.">
<meta property="og:image" content="https://vaulted-bus-346411.web.app/office/og.png">
<meta property="og:url" content="https://vaulted-bus-346411.web.app/office">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<style>
  html, body { margin: 0; height: 100%; background: #4e4f7a; font-family: sans-serif; }
  #info { position: fixed; top: 12px; left: 12px; color: #fff; background: #0006; padding: 8px 12px; border-radius: 8px; }
  button { margin-top: 6px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="info"><span id="msg">불러오는 중…</span><br><button id="toggle" disabled>앞벽 숨기기</button> <button id="music">🎵 음악 켜기</button></div>
<!-- 배경음악: 루릭이 만든 「고양이 다락방 빗소리」 기타 10곡을 이어 붙인 것. 브라우저 규칙상 눌러야 재생 -->
<audio id="bgm" src="./bgm.mp3" loop preload="none"></audio>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

// 인형 GLB 는 Draco 압축 (prep_models.py) → 풀어 줄 디코더
const draco = new DRACOLoader();
draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/gltf/');
const charLoader = new GLTFLoader().setDRACOLoader(draco);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#4e4f7a');
scene.add(new THREE.HemisphereLight('#ffffff', '#55506a', 1.6));
const sun = new THREE.DirectionalLight('#ffd9b0', 2.0); sun.position.set(6, 14, 8); scene.add(sun);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 200);
// [카메라 위치, 바라보는 곳] — 블렌더 좌표(x, y, z)를 웹(x, z, -y)으로 바꾼 값
const VIEW_OUTSIDE = [[26, 24, 34], [-0.5, 4.5, 0]];
const VIEW_INSIDE = [[-3, 6, 24], [-3, 5, -2.5]];
camera.position.set(...VIEW_OUTSIDE[0]);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(...VIEW_OUTSIDE[1]);
controls.update();

const front = [];
const koi = [];
const POND = new THREE.Vector3(-5, 0, 4.6);   // 연못 중심: 블렌더 (-5, -4.6) → 웹 (x, ·, -y)
const OWNERS = ['hermi', 'jujuya', 'luna', 'nova', 'pureum', 'rurik', 'clo'];
new GLTFLoader().load(`./office.glb?v=${Date.now()}`, (gltf) => {
  scene.add(gltf.scene);
  let meshes = 0;
  gltf.scene.traverse((o) => {
    if (o.isMesh) meshes++;
    if (o.name.startsWith('house_front_') || o.name.startsWith('dorm_front_')) front.push(o);
  });
  const msg = `GLB 열림 ✅ 메시 ${meshes}개 · 앞벽 ${front.length}개`;
  document.getElementById('msg').textContent = msg;
  console.log(msg);
  // 인형은 characters/ 에 따로 → office.glb 안의 자리 표시(char_<이름> 빈 물체)에 앉힌다
  let seated = 0;
  for (const owner of OWNERS) {
    const spot = gltf.scene.getObjectByName(`char_${owner}`);
    if (!spot) continue;
    charLoader.load(`./characters/char_${owner}.glb?v=${Date.now()}`, (c) => {  // 확인용이라 캐시 안 씀
      c.scene.position.y = -0.03;  // build 때처럼 방석에 살짝 파묻히게
      spot.add(c.scene);
      document.getElementById('msg').textContent = `${msg} · 직원 ${++seated}/${OWNERS.length}명`;
    }, undefined, (err) => console.error(owner, err));
  }
  // 잉어: 연못 중심을 반시계로 빙글빙글 (블렌더 island.py 의 KOI 자리에서 출발)
  gltf.scene.traverse((o) => {
    if (!/^island_pond_koi_\d+$/.test(o.name)) return;
    const dx = o.position.x - POND.x, dz = o.position.z - POND.z;
    koi.push({ o, r: Math.hypot(dx, dz), a: Math.atan2(-dz, dx), y: o.position.y });
  });
  const btn = document.getElementById('toggle');
  btn.disabled = false;
  btn.onclick = () => {
    const hide = front[0].visible;
    front.forEach((o) => { o.visible = !hide; });
    btn.textContent = hide ? '앞벽 보이기' : '앞벽 숨기기';
    // 앞벽을 숨기면 정면(블렌더 cam_inside)으로, 다시 보이면 바깥(cam_main)으로
    const [pos, target] = hide ? VIEW_INSIDE : VIEW_OUTSIDE;
    camera.position.set(...pos); controls.target.set(...target); controls.update();
  };
}, undefined, (err) => {
  document.getElementById('msg').textContent = 'GLB 열기 실패 ❌ ' + err.message;
  console.error(err);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  koi.forEach((k, i) => {
    const a = k.a + t * 0.3 / Math.max(k.r, 0.4);          // 바깥쪽 잉어는 천천히 (선속도 0.3m/s 쯤)
    k.o.position.set(POND.x + k.r * Math.cos(a), k.y, POND.z - k.r * Math.sin(a));
    k.o.rotation.y = a + Math.PI / 2 + 0.18 * Math.sin(t * 5 + i);   // 진행 방향 + 꼬리 살랑
  });
  renderer.render(scene, camera);
});

const bgm = document.getElementById('bgm');
const musicBtn = document.getElementById('music');
bgm.volume = 0.5;
musicBtn.onclick = () => {
  if (bgm.paused) { bgm.play(); musicBtn.textContent = '🔇 음악 끄기'; }
  else { bgm.pause(); musicBtn.textContent = '🎵 음악 켜기'; }
};
</script>
</body>
</html>
